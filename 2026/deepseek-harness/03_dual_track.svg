<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420"><defs><marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#6c8eef"/></marker></defs><rect width="680" height="420" fill="#fff"/><text x="340" y="32" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="19" fill="#3b5bdb" font-weight="700" text-anchor="middle">双轨迹：Session Log vs Surface</text><rect x="40" y="66" width="290" height="250" rx="10" fill="#f7f8fd" stroke="#24357e" stroke-width="2"/><text x="185" y="94" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#24357e" font-weight="700" text-anchor="middle">Session Log</text><text x="185" y="118" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#646e85" font-weight="normal" text-anchor="middle">只追加，不修改，永不压缩</text><text x="60" y="146" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="9" fill="#232838" font-weight="normal" text-anchor="start">[User] 初始请求</text><text x="60" y="170" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="9" fill="#232838" font-weight="normal" text-anchor="start">[Agent] 思考链</text><text x="60" y="194" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="9" fill="#232838" font-weight="normal" text-anchor="start">[Tool] 调用API</text><text x="60" y="218" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="9" fill="#232838" font-weight="normal" text-anchor="start">[Tool] 返回结果</text><text x="60" y="242" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="9" fill="#232838" font-weight="normal" text-anchor="start">[Agent] 重试</text><text x="60" y="266" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="9" fill="#232838" font-weight="normal" text-anchor="start">[Tool] 成功数据</text><text x="60" y="290" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="9" fill="#232838" font-weight="normal" text-anchor="start">[Assistant] 最终回复</text><rect x="350" y="66" width="290" height="250" rx="10" fill="#f7f8fd" stroke="#3b5bdb" stroke-width="2"/><text x="495" y="94" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#3b5bdb" font-weight="700" text-anchor="middle">Surface（模型视图）</text><text x="495" y="118" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#646e85" font-weight="normal" text-anchor="middle">可压缩的精简内容</text><rect x="375" y="140" width="240" height="50" rx="6" fill="#fff" stroke="#6c8eef" stroke-width="1"/><text x="495" y="162" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#6c8eef" font-weight="600" text-anchor="middle">早期历史已压缩为摘要</text><text x="495" y="180" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="9" fill="#646e85" font-weight="normal" text-anchor="middle">（原始记录仍在 Log 中）</text><text x="375" y="216" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="9" fill="#232838" font-weight="normal" text-anchor="start">[User] 初始请求</text><text x="375" y="240" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="9" fill="#232838" font-weight="normal" text-anchor="start">[Tool] 最终成功数据</text><text x="375" y="264" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="9" fill="#232838" font-weight="normal" text-anchor="start">[Assistant] 最终回复</text><line x1="330" y1="191" x2="350" y2="191" stroke="#c08a3a" stroke-width="2" marker-end="url(#arr)"/><text x="340" y="180" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="9" fill="#c08a3a" font-weight="600" text-anchor="middle">压缩</text><rect x="90" y="336" width="500" height="60" rx="8" fill="#e9edfa" stroke="#3b5bdb" stroke-width="1.5"/><text x="340" y="360" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="#3b5bdb" font-weight="700" text-anchor="middle">Model-visible means logged</text><text x="340" y="382" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#646e85" font-weight="normal" text-anchor="middle">模型看到的一切，都能从日志重建——调试复盘的终极武器</text></svg>