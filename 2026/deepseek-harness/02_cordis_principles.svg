<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440"><defs><marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#6c8eef"/></marker></defs><rect width="680" height="440" fill="#fff"/><text x="340" y="32" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="19" fill="#3b5bdb" font-weight="700" text-anchor="middle">Cordis 插件内核：四大机制</text><rect x="40" y="62" width="600" height="82" rx="8" fill="#f7f8fd" stroke="#3b5bdb" stroke-width="1.8"/><text x="75" y="90" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#3b5bdb" font-weight="700" text-anchor="start">Service</text><text x="75" y="112" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#232838" font-weight="normal" text-anchor="start">Provider 发布能力，Consumer 声明依赖</text><text x="620" y="94" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#646e85" font-weight="600" text-anchor="end">装配阶段缺依赖直接报错</text><text x="620" y="114" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#646e85" font-weight="600" text-anchor="end">不是运行到一半才炸</text><rect x="40" y="158" width="600" height="82" rx="8" fill="#f7f8fd" stroke="#6c8eef" stroke-width="1.8"/><text x="75" y="186" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#6c8eef" font-weight="700" text-anchor="start">Event</text><text x="75" y="208" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#232838" font-weight="normal" text-anchor="start">Waterfall 瀑布流：监听器依次判断是否继续</text><text x="620" y="190" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#646e85" font-weight="600" text-anchor="end">消息传递 → 流程控制</text><text x="620" y="210" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#646e85" font-weight="600" text-anchor="end">权限插件可拦截工具调用</text><rect x="40" y="254" width="600" height="82" rx="8" fill="#f7f8fd" stroke="#c08a3a" stroke-width="1.8"/><text x="75" y="282" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#c08a3a" font-weight="700" text-anchor="start">Effect</text><text x="75" y="304" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#232838" font-weight="normal" text-anchor="start">可逆效应：卸载时完全撤销副作用</text><text x="620" y="286" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#646e85" font-weight="600" text-anchor="end">时间可组合性</text><text x="620" y="306" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#646e85" font-weight="600" text-anchor="end">装装卸卸系统干干净净</text><rect x="40" y="350" width="600" height="82" rx="8" fill="#f7f8fd" stroke="#4a8c6f" stroke-width="1.8"/><text x="75" y="378" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#4a8c6f" font-weight="700" text-anchor="start">Scope</text><text x="75" y="400" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#232838" font-weight="normal" text-anchor="start">插件作用域：隔离 + 按需加载</text><text x="620" y="382" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#646e85" font-weight="600" text-anchor="end">空间可组合性</text><text x="620" y="402" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#646e85" font-weight="600" text-anchor="end">依赖关系清晰管理</text></svg>