<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400"><defs><marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#d08b4e"/></marker><marker id="arrw" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#b5443a"/></marker></defs><rect width="680" height="400" fill="#fff"/><text x="340" y="32" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="19" fill="#a05a2c" font-weight="700" text-anchor="middle">记忆系统怎么考试</text><text x="60" y="72" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#a05a2c" font-weight="700" text-anchor="start">三种考法</text><rect x="50" y="88" width="360" height="52" rx="8" fill="#fdf9f4" stroke="#d08b4e" stroke-width="1.5"/><text x="70" y="110" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="#a05a2c" font-weight="700" text-anchor="start">直接回忆</text><text x="70" y="130" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#7d6b5d" font-weight="normal" text-anchor="start">植入「花生过敏」→ 问「避开什么」</text><rect x="50" y="150" width="360" height="52" rx="8" fill="#fdf9f4" stroke="#d08b4e" stroke-width="1.5"/><text x="70" y="172" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="#a05a2c" font-weight="700" text-anchor="start">多跳推理</text><text x="70" y="192" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#7d6b5d" font-weight="normal" text-anchor="start">素食+不吃香菜 → 问「推荐餐厅」</text><rect x="50" y="212" width="360" height="52" rx="8" fill="#fdf9f4" stroke="#d08b4e" stroke-width="1.5"/><text x="70" y="234" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="#a05a2c" font-weight="700" text-anchor="start">时效判断</text><text x="70" y="254" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#7d6b5d" font-weight="normal" text-anchor="start">预算3000→改5000 → 问「按哪个」</text><text x="440" y="72" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#a05a2c" font-weight="700" text-anchor="start">两个指标</text><rect x="440" y="88" width="200" height="84" rx="8" fill="#fdf9f4" stroke="#4a7c59" stroke-width="1.8"/><text x="540" y="116" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#4a7c59" font-weight="700" text-anchor="middle">记忆命中率</text><text x="540" y="142" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#7d6b5d" font-weight="normal" text-anchor="middle">该记的记起来没</text><rect x="440" y="186" width="200" height="84" rx="8" fill="#fdf9f4" stroke="#b5443a" stroke-width="1.8"/><text x="540" y="214" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#b5443a" font-weight="700" text-anchor="middle">错误召回率</text><text x="540" y="240" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#7d6b5d" font-weight="normal" text-anchor="middle">不该记的瞎记多少</text><rect x="90" y="316" width="500" height="56" rx="8" fill="#f7ecdd" stroke="#a05a2c" stroke-width="1.5"/><text x="340" y="340" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#a05a2c" font-weight="600" text-anchor="middle">方法：植入 20 条事实 → 开新会话提问 → 打分</text><text x="340" y="362" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#7d6b5d" font-weight="normal" text-anchor="middle">基准：LongMemEval（5 大类 500 题）</text></svg>