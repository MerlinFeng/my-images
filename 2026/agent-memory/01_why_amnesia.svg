<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360"><defs><marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#d08b4e"/></marker><marker id="arrw" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#b5443a"/></marker></defs><rect width="680" height="360" fill="#fff"/><text x="340" y="32" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="19" fill="#a05a2c" font-weight="700" text-anchor="middle">LLM 是无状态函数：每次调用都是全新开始</text><rect x="60" y="62" width="240" height="110" rx="8" fill="#fdf9f4" stroke="#d08b4e" stroke-width="1.8"/><text x="180" y="90" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#a05a2c" font-weight="700" text-anchor="middle">调用 #1</text><text x="180" y="116" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#7d6b5d" font-weight="normal" text-anchor="middle">f(prompt) → completion</text><text x="180" y="140" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#3a2f28" font-weight="normal" text-anchor="middle">「我叫张三」</text><text x="180" y="160" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#4a7c59" font-weight="normal" text-anchor="middle">好的，记住了 ✓</text><rect x="60" y="196" width="240" height="110" rx="8" fill="#fdf9f4" stroke="#b5443a" stroke-width="1.8"/><text x="180" y="224" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#b5443a" font-weight="700" text-anchor="middle">调用 #2</text><text x="180" y="250" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#7d6b5d" font-weight="normal" text-anchor="middle">f(prompt) → completion</text><text x="180" y="274" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#3a2f28" font-weight="normal" text-anchor="middle">「我叫什么？」</text><text x="180" y="294" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#b5443a" font-weight="normal" text-anchor="middle">我不知道你是谁 ✗</text><rect x="340" y="62" width="300" height="244" rx="8" fill="#f7ecdd" stroke="#a05a2c" stroke-width="2"/><text x="490" y="92" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#a05a2c" font-weight="700" text-anchor="middle">真相</text><text x="362" y="122" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="#d08b4e" font-weight="700" text-anchor="start">•</text><text x="378" y="122" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#3a2f28" font-weight="normal" text-anchor="start">调用之间毫无关联</text><text x="362" y="166" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="#d08b4e" font-weight="700" text-anchor="start">•</text><text x="378" y="166" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#3a2f28" font-weight="normal" text-anchor="start">模型不会自动存任何东西</text><text x="362" y="210" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="#d08b4e" font-weight="700" text-anchor="start">•</text><text x="378" y="210" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#3a2f28" font-weight="normal" text-anchor="start">「记得」是把历史塞回 prompt</text><text x="362" y="254" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="#d08b4e" font-weight="700" text-anchor="start">•</text><text x="378" y="254" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#3a2f28" font-weight="normal" text-anchor="start">窗口装不下的就真的忘了</text><text x="490" y="330" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#a05a2c" font-weight="700" text-anchor="middle">记忆 = 你要写的工程，不是模型的能力</text></svg>