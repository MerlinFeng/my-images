<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360"><defs><marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#d08b4e"/></marker><marker id="arrw" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#b5443a"/></marker></defs><rect width="680" height="360" fill="#fff"/><text x="340" y="32" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" fill="#a05a2c" font-weight="700" text-anchor="middle">记忆系统踩坑实录</text><rect x="40" y="66" width="290" height="112" rx="10" fill="#fdf9f4" stroke="#b5443a" stroke-width="2"/><circle cx="70" cy="100" r="16" fill="#b5443a"/><text x="70" y="105" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="98" y="96" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#b5443a" font-weight="700" text-anchor="start">写入泛滥</text><text x="98" y="122" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#7d6b5d" font-weight="normal" text-anchor="start">两周存了 4000 条废话</text><text x="98" y="152" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#3a2f28" font-weight="600" text-anchor="start">→ 限定四类 + 重要性阈值</text><rect x="355" y="66" width="290" height="112" rx="10" fill="#fdf9f4" stroke="#a05a2c" stroke-width="2"/><circle cx="385" cy="100" r="16" fill="#a05a2c"/><text x="385" y="105" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="413" y="96" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#a05a2c" font-weight="700" text-anchor="start">幻觉入库</text><text x="413" y="122" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#7d6b5d" font-weight="normal" text-anchor="start">模型脑补的当事实存了</text><text x="413" y="152" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#3a2f28" font-weight="600" text-anchor="start">→ 来源标记，只用 user_stated</text><rect x="40" y="201" width="290" height="112" rx="10" fill="#fdf9f4" stroke="#d08b4e" stroke-width="2"/><circle cx="70" cy="235" r="16" fill="#d08b4e"/><text x="70" y="240" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="98" y="231" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#d08b4e" font-weight="700" text-anchor="start">忘了忘记</text><text x="98" y="257" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#7d6b5d" font-weight="normal" text-anchor="start">三年后还按旧年龄推荐</text><text x="98" y="287" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#3a2f28" font-weight="600" text-anchor="start">→ 定期衰减：低分+久未访问→删</text><rect x="355" y="201" width="290" height="112" rx="10" fill="#fdf9f4" stroke="#7a4420" stroke-width="2"/><circle cx="385" cy="235" r="16" fill="#7a4420"/><text x="385" y="240" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">4</text><text x="413" y="231" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#7a4420" font-weight="700" text-anchor="start">隐私裸奔</text><text x="413" y="257" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#7d6b5d" font-weight="normal" text-anchor="start">手机号身份证进了向量库</text><text x="413" y="287" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#3a2f28" font-weight="600" text-anchor="start">→ 入库前正则脱敏</text></svg>