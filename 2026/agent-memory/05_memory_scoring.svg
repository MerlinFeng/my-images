<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400"><defs><marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#d08b4e"/></marker><marker id="arrw" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#b5443a"/></marker></defs><rect width="680" height="400" fill="#fff"/><text x="340" y="32" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="19" fill="#a05a2c" font-weight="700" text-anchor="middle">记忆检索评分：三个因子</text><rect x="90" y="58" width="500" height="48" rx="8" fill="#f7ecdd" stroke="#a05a2c" stroke-width="2"/><text x="340" y="88" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#a05a2c" font-weight="700" text-anchor="middle">score = 0.6·相关度 + 0.2·新近性 + 0.2·重要性</text><rect x="50" y="130" width="580" height="68" rx="8" fill="#fdf9f4" stroke="#a05a2c" stroke-width="1.5"/><text x="85" y="158" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#a05a2c" font-weight="700" text-anchor="start">相关度</text><text x="85" y="182" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#7d6b5d" font-weight="normal" text-anchor="start">聊什么取什么</text><rect x="330" y="150" width="240" height="14" rx="7" fill="#e8d8c4"/><rect x="330" y="150" width="216" height="14" rx="7" fill="#a05a2c"/><text x="330" y="182" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#7d6b5d" font-weight="normal" text-anchor="start">cosine(记忆, 当前问题)</text><rect x="50" y="212" width="580" height="68" rx="8" fill="#fdf9f4" stroke="#d08b4e" stroke-width="1.5"/><text x="85" y="240" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#d08b4e" font-weight="700" text-anchor="start">新近性</text><text x="85" y="264" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#7d6b5d" font-weight="normal" text-anchor="start">用进废退，取中刷新</text><rect x="330" y="232" width="240" height="14" rx="7" fill="#e8d8c4"/><rect x="330" y="232" width="132" height="14" rx="7" fill="#d08b4e"/><text x="330" y="264" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#7d6b5d" font-weight="normal" text-anchor="start">exp(-天数/30天半衰期)</text><rect x="50" y="294" width="580" height="68" rx="8" fill="#fdf9f4" stroke="#7a4420" stroke-width="1.5"/><text x="85" y="322" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#7a4420" font-weight="700" text-anchor="start">重要性</text><text x="85" y="346" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#7d6b5d" font-weight="normal" text-anchor="start">身份证不会被闲聊挤掉</text><rect x="330" y="314" width="240" height="14" rx="7" fill="#e8d8c4"/><rect x="330" y="314" width="168" height="14" rx="7" fill="#7a4420"/><text x="330" y="346" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#7d6b5d" font-weight="normal" text-anchor="start">写入时打分 0~1</text><text x="340" y="386" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#7d6b5d" font-weight="normal" text-anchor="middle">取 Top-K 注入 prompt，被取中的记忆刷新 last_access</text></svg>