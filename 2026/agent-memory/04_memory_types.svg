<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380"><defs><marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#d08b4e"/></marker><marker id="arrw" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#b5443a"/></marker></defs><rect width="680" height="380" fill="#fff"/><text x="340" y="32" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="19" fill="#a05a2c" font-weight="700" text-anchor="middle">长期记忆记什么：三种类型</text><rect x="40" y="66" width="190" height="250" rx="10" fill="#fdf9f4" stroke="#a05a2c" stroke-width="2"/><text x="135" y="96" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#a05a2c" font-weight="700" text-anchor="middle">语义记忆</text><rect x="85" y="108" width="100" height="26" rx="13" fill="#a05a2c" stroke="#a05a2c" stroke-width="0"/><text x="135" y="126" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#fff" font-weight="600" text-anchor="middle">是什么</text><text x="135" y="170" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#3a2f28" font-weight="normal" text-anchor="middle">「用户叫张三」</text><text x="135" y="204" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#3a2f28" font-weight="normal" text-anchor="middle">「报销上限 5000」</text><text x="135" y="238" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#3a2f28" font-weight="normal" text-anchor="middle">「产品A不支持IE」</text><rect x="250" y="66" width="190" height="250" rx="10" fill="#fdf9f4" stroke="#d08b4e" stroke-width="2"/><text x="345" y="96" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#d08b4e" font-weight="700" text-anchor="middle">情景记忆</text><rect x="295" y="108" width="100" height="26" rx="13" fill="#d08b4e" stroke="#d08b4e" stroke-width="0"/><text x="345" y="126" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#fff" font-weight="600" text-anchor="middle">发生过什么</text><text x="345" y="170" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#3a2f28" font-weight="normal" text-anchor="middle">「3月2日投诉过物流」</text><text x="345" y="204" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#3a2f28" font-weight="normal" text-anchor="middle">「补偿了优惠券」</text><text x="345" y="238" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#3a2f28" font-weight="normal" text-anchor="middle">带时间戳的事件</text><rect x="460" y="66" width="190" height="250" rx="10" fill="#fdf9f4" stroke="#7a4420" stroke-width="2"/><text x="555" y="96" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#7a4420" font-weight="700" text-anchor="middle">程序性记忆</text><rect x="505" y="108" width="100" height="26" rx="13" fill="#7a4420" stroke="#7a4420" stroke-width="0"/><text x="555" y="126" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#fff" font-weight="600" text-anchor="middle">该怎么做</text><text x="555" y="170" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#3a2f28" font-weight="normal" text-anchor="middle">「退款先查订单状态」</text><text x="555" y="204" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#3a2f28" font-weight="normal" text-anchor="middle">「再核实支付流水」</text><text x="555" y="238" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#3a2f28" font-weight="normal" text-anchor="middle">从历史提炼的流程</text><rect x="90" y="336" width="500" height="32" rx="6" fill="#f7ecdd" stroke="#a05a2c" stroke-width="1"/><text x="340" y="357" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#a05a2c" font-weight="600" text-anchor="middle">三类共用一个存储，用 type 字段区分即可</text></svg>