<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440"><defs><marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#d08b4e"/></marker><marker id="arrw" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#b5443a"/></marker></defs><rect width="680" height="440" fill="#fff"/><text x="340" y="32" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="19" fill="#a05a2c" font-weight="700" text-anchor="middle">带记忆的 Agent 主循环：六步</text><rect x="40" y="62" width="290" height="66" rx="8" fill="#fdf9f4" stroke="#d08b4e" stroke-width="1.8"/><text x="58" y="90" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="#d08b4e" font-weight="700" text-anchor="start">① 恢复短期记忆</text><text x="58" y="112" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#7d6b5d" font-weight="normal" text-anchor="start">sessions.load(thread_id)</text><rect x="355" y="62" width="290" height="66" rx="8" fill="#fdf9f4" stroke="#a05a2c" stroke-width="1.8"/><text x="373" y="90" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="#a05a2c" font-weight="700" text-anchor="start">② 检索长期记忆</text><text x="373" y="112" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#7d6b5d" font-weight="normal" text-anchor="start">retrieve(query) → 注入上下文</text><rect x="40" y="144" width="290" height="66" rx="8" fill="#fdf9f4" stroke="#7d6b5d" stroke-width="1.8"/><text x="58" y="172" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="#7d6b5d" font-weight="700" text-anchor="start">③ 跑一轮对话</text><text x="58" y="194" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#7d6b5d" font-weight="normal" text-anchor="start">messages + reply</text><rect x="355" y="144" width="290" height="66" rx="8" fill="#fdf9f4" stroke="#d08b4e" stroke-width="1.8"/><text x="373" y="172" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="#d08b4e" font-weight="700" text-anchor="start">④ 压缩工作记忆</text><text x="373" y="194" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#7d6b5d" font-weight="normal" text-anchor="start">compress_context(keep_recent=4)</text><rect x="40" y="226" width="290" height="66" rx="8" fill="#fdf9f4" stroke="#d08b4e" stroke-width="1.8"/><text x="58" y="254" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="#d08b4e" font-weight="700" text-anchor="start">⑤ 短期记忆落盘</text><text x="58" y="276" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#7d6b5d" font-weight="normal" text-anchor="start">sessions.save(thread_id)</text><rect x="355" y="226" width="290" height="66" rx="8" fill="#fdf9f4" stroke="#a05a2c" stroke-width="1.8"/><text x="373" y="254" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="#a05a2c" font-weight="700" text-anchor="start">⑥ 提炼长期记忆</text><text x="373" y="276" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#7d6b5d" font-weight="normal" text-anchor="start">maybe_remember（异步线程）</text><line x1="185" y1="128" x2="185" y2="142" stroke="#d08b4e" stroke-width="1.5" marker-end="url(#arr)"/><line x1="500" y1="128" x2="500" y2="142" stroke="#d08b4e" stroke-width="1.5" marker-end="url(#arr)"/><line x1="185" y1="210" x2="185" y2="224" stroke="#d08b4e" stroke-width="1.5" marker-end="url(#arr)"/><line x1="500" y1="210" x2="500" y2="224" stroke="#d08b4e" stroke-width="1.5" marker-end="url(#arr)"/><path d="M 645 95 L 660 95 L 660 177 L 645 177" stroke="#d08b4e" stroke-width="1.5" fill="none" marker-end="url(#arr)"/><path d="M 645 259 L 660 259 L 660 341 L 645 341" stroke="#d08b4e" stroke-width="1.5" fill="none" marker-end="url(#arr)"/><rect x="90" y="380" width="500" height="34" rx="6" fill="#f7ecdd" stroke="#a05a2c" stroke-width="1"/><text x="340" y="402" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#a05a2c" font-weight="600" text-anchor="middle">进来：恢复短期 + 取回长期 ｜ 出去：压缩 + 落盘 + 提炼</text></svg>