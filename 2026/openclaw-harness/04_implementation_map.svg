<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440"><defs><marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#5a9e99"/></marker></defs><rect width="680" height="440" fill="#fff"/><text x="340" y="32" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="19" fill="#2f6f6b" font-weight="700" text-anchor="middle">OpenClaw 怎么做这四件事</text><rect x="40" y="62" width="600" height="82" rx="8" fill="#f6faf9" stroke="#2f6f6b" stroke-width="1.8"/><text x="75" y="88" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#2f6f6b" font-weight="700" text-anchor="start">循环控制</text><text x="75" y="110" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#5f7676" font-weight="normal" text-anchor="start">Agent 运行时内置 ReAct 循环</text><text x="75" y="130" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#5f7676" font-weight="normal" text-anchor="start">+ HEARTBEAT 心跳定时唤醒</text><text x="620" y="104" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#2f6f6b" font-weight="600" text-anchor="end">被动→主动</text><rect x="40" y="156" width="600" height="82" rx="8" fill="#f6faf9" stroke="#5a9e99" stroke-width="1.8"/><text x="75" y="182" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#5a9e99" font-weight="700" text-anchor="start">上下文装配</text><text x="75" y="204" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#5f7676" font-weight="normal" text-anchor="start">Markdown 文件化记忆（可读可改可迁移）</text><text x="75" y="224" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#5f7676" font-weight="normal" text-anchor="start">+ Skills 目录按需渐进加载</text><text x="620" y="198" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#5a9e99" font-weight="600" text-anchor="end">透明可迁移</text><rect x="40" y="250" width="600" height="82" rx="8" fill="#f6faf9" st