<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440"><defs><marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#5a9e99"/></marker></defs><rect width="680" height="440" fill="#fff"/><text x="340" y="32" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="19" fill="#2f6f6b" font-weight="700" text-anchor="middle">Harness 的四个核心职责</text><rect x="40" y="62" width="600" height="82" rx="10" fill="#f6faf9" stroke="#2f6f6b" stroke-width="2"/><text x="75" y="90" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#2f6f6b" font-weight="700" text-anchor="start">循环控制</text><text x="75" y="112" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#5f7676" font-weight="normal" text-anchor="start">步数 + 时间 + token 三重保险丝</text><text x="75" y="130" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#5f7676" font-weight="normal" text-anchor="start">任何一到就强制收尾 + 降级</text><text x="620" y="96" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#1f3030" font-weight="600" text-anchor="end">模型说「做完了」才停</text><text x="620" y="116" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#1f3030" font-weight="600" text-anchor="end">卡住也要安全退出</text><rect x="40" y="156" width="600" height="82" rx="10" fill="#f6faf9" stroke="#5a9e99" stroke-width="2"/><text x="75" y="184" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#5a9e99" font-weight="700" text-anchor="start">上下文装配</text><text x="75" y="206" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#5f7676" font-weight="normal" text-anchor="start">system prompt + 记忆注入</text><text x="75" y="224" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#5f7676" font-weight="normal" text-anchor="start">+ 历史压缩 + 工具结果拼装</text><text x="620" y="190" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#1f3030" font-weight="600" text-anchor="end">模型看到的世界</text><text x="620" y="210" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#1f3030" font-weight="600" text-anchor="end">是 Harness 裁剪过的</text><rect x="40" y="250" width="600" height="82" rx="10" fill="#f6faf9" stroke="#c08a3a" stroke-width="2"/><text x="75" y="278" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#c08a3a" font-weight="700" text-anchor="start">工具调度</text><text x="75" y="300" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#5f7676" font-weight="normal" text-anchor="start">存在校验 → 权限校验 → 参数校验</text><text x="75" y="318" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#5f7676" font-weight="normal" text-anchor="start">三个都过了才真正执行</text><text x="620" y="284" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#1f3030" font-weight="600" text-anchor="end">模型只是「提议」</text><text x="620" y="304" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#1f3030" font-weight="600" text-anchor="end">Harness 才是「裁决」</text><rect x="40" y="344" width="600" height="82" rx="10" fill="#f6faf9" stroke="#4a8c6f" stroke-width="2"/><text x="75" y="372" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#4a8c6f" font-weight="700" text-anchor="start">状态管理</text><text x="75" y="394" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#5f7676" font-weight="normal" text-anchor="start">会话落库 + 每步 checkpoint</text><text x="75" y="412" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#5f7676" font-weight="normal" text-anchor="start">进程挂了从断点恢复</text><text x="620" y="378" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#1f3030" font-weight="600" text-anchor="end">模型完全无状态</text><text x="620" y="398" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#1f3030" font-weight="600" text-anchor="end">状态全是 Harness 在扛</text></svg>