<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380"><defs><marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#5a9e99"/></marker></defs><rect width="680" height="380" fill="#fff"/><text x="340" y="32" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#2f6f6b" font-weight="700" text-anchor="middle">OpenClaw Gateway：一条消息的完整旅程</text><rect x="30" y="80" width="118" height="80" rx="8" fill="#f6faf9" stroke="#5f7676" stroke-width="1.8"/><text x="89" y="106" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#5f7676" font-weight="700" text-anchor="middle">渠道适配器</text><text x="89" y="126" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="9" fill="#5f7676" font-weight="normal" text-anchor="middle">30 个平台</text><text x="89" y="144" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="9" fill="#5f7676" font-weight="normal" text-anchor="middle">格式归一化</text><line x1="148" y1="120" x2="160" y2="120" stroke="#5a9e99" stroke-width="1.5" marker-end="url(#arr)"/><rect x="160" y="80" width="118" height="80" rx="8" fill="#f6faf9" stroke="#2f6f6b" stroke-width="1.8"/><text x="219" y="106" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#2f6f6b" font-weight="700" text-anchor="middle">会话管理</text><text x="219" y="126" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="9" fill="#5f7676" font-weight="normal" text-anchor="middle">找到你的</text><text x="219" y="144" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="9" fill="#5f7676" font-weight="normal" text-anchor="middle">上下文</text><line x1="278" y1="120" x2="290" y2="120" stroke="#5a9e99" stroke-width="1.5" marker-end="url(#arr)"/><rect x="290" y="80" width="118" height="80" rx="8" fill="#f6faf9" stroke="#c08a3a" stroke-width="1.8"/><text x="349" y="106" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#c08a3a" font-weight="700" text-anchor="middle">队列</text><text x="349" y="126" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="9" fill="#5f7676" font-weight="normal" text-anchor="middle">并发请求</text><text x="349" y="144" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="9" fill="#5f7676" font-weight="normal" text-anchor="middle">串行化</text><line x1="408" y1="120" x2="420" y2="120" stroke="#5a9e99" stroke-width="1.5" marker-end="url(#arr)"/><rect x="420" y="80" width="118" height="80" rx="8" fill="#f6faf9" stroke="#1a4540" stroke-width="1.8"/><text x="479" y="106" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#1a4540" font-weight="700" text-anchor="middle">Agent 循环</text><text x="479" y="126" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="9" fill="#5f7676" font-weight="normal" text-anchor="middle">推理→工具</text><text x="479" y="144" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="9" fill="#5f7676" font-weight="normal" text-anchor="middle">→再推理</text><line x1="538" y1="120" x2="550" y2="120" stroke="#5a9e99" stroke-width="1.5" marker-end="url(#arr)"/><rect x="550" y="80" width="118" height="80" rx="8" fill="#f6faf9" stroke="#4a8c6f" stroke-width="1.8"/><text x="609" y="106" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#4a8c6f" font-weight="700" text-anchor="middle">原路返回</text><text x="609" y="126" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="9" fill="#5f7676" font-weight="normal" text-anchor="middle">回复送回你</text><text x="609" y="144" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="9" fill="#5f7676" font-weight="normal" text-anchor="middle">所在的软件</text><text x="340" y="198" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#2f6f6b" font-weight="700" text-anchor="middle">同一个 Node 进程内：Gateway + Agent 运行时</text><rect x="80" y="216" width="520" height="50" rx="6" fill="#e4f2f0" stroke="#2f6f6b" stroke-width="1"/><text x="340" y="236" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#1f3030" font-weight="normal" text-anchor="middle">逻辑分离，物理一体：Gateway 管路/会话/权限，Agent 管思考/工具</text><text x="340" y="256" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#1f3030" font-weight="normal" text-anchor="middle">默认不配，装上就用；多 Agent 才需要在 openclaw.json 里声明</text><rect x="80" y="280" width="520" height="80" rx="8" fill="#f6faf9" stroke="#1a4540" stroke-width="1.5"/><text x="340" y="304" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="#1a4540" font-weight="700" text-anchor="middle">配置入口：~/.openclaw/openclaw.json</text><text x="340" y="326" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#5f7676" font-weight="normal" text-anchor="middle">模型、心跳、技能、沙箱、多 Agent 路由——全在这一个 JSON 里</text><text x="340" y="346" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#5f7676" font-weight="normal" text-anchor="middle">最小化：openclaw onboard 自动生成，API key 放环境变量即可</text></svg>