<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400">
<defs>
  <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" style="stop-color:#e8f0ea;stop-opacity:0.6"/>
    <stop offset="100%" style="stop-color:#f5faf7;stop-opacity:1"/>
  </linearGradient>
  <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1a3e28" flood-opacity="0.08"/>
  </filter>
  <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#5a8a6a"/>
  </marker>
  <marker id="arrowhead_accent" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#5ba36b"/>
  </marker>
</defs>
<rect width="720" height="400" fill="url(#bgGrad)" rx="12"/>
<text x="360.0" y="32" font-family="-apple-system, PingFang SC, sans-serif" font-size="19" fill="#1a3e28" font-weight="700" text-anchor="middle">文档切块策略：有重叠的滑动窗口</text><text x="60" y="72" font-family="-apple-system, PingFang SC, sans-serif" font-size="13" fill="#4a6b54" font-weight="normal" text-anchor="start">原始长文本:</text><rect x="60" y="82" width="600" height="34" rx="6" fill="#1a3e28" opacity="0.85"/><text x="360" y="104" font-family="-apple-system, PingFang SC, sans-serif" font-size="12" fill="#fff" font-weight="normal" text-anchor="middle">公司考勤管理制度……年假申请需要提前三个工作日提交……</text><rect x="60" y="140" width="300" height="38" rx="6" fill="#5ba36b" opacity="0.7" stroke="#5ba36b" stroke-width="1.5"/><text x="210.0" y="164" font-family="-apple-system, PingFang SC, sans-serif" font-size="12" fill="#fff" font-weight="600" text-anchor="middle">Chunk 1</text><rect x="250" y="195" width="300" height="38" rx="6" fill="#3d7a5d" opacity="0.7" stroke="#3d7a5d" stroke-width="1.5"/><text x="400.0" y="219" font-family="-apple-system, PingFang SC, sans-serif" font-size="12" fill="#fff" font-weight="600" text-anchor="middle">Chunk 2</text><rect x="250" y="191" width="110" height="46" rx="4" fill="none" stroke="#e8b84a" stroke-width="1.5" stroke-dasharray="4,3"/><rect x="440" y="250" width="300" height="38" rx="6" fill="#2d5a3d" opacity="0.7" stroke="#2d5a3d" stroke-width="1.5"/><text x="590.0" y="274" font-family="-apple-system, PingFang SC, sans-serif" font-size="12" fill="#fff" font-weight="600" text-anchor="middle">Chunk 3</text><rect x="440" y="246" width="110" height="46" rx="4" fill="none" stroke="#e8b84a" stroke-width="1.5" stroke-dasharray="4,3"/><text x="370" y="240.5" font-family="-apple-system, PingFang SC, sans-serif" font-size="11" fill="#e8b84a" font-weight="normal" text-anchor="middle">← 重叠区 (overlap) →</text><text x="370" y="256.5" font-family="-apple-system, PingFang SC, sans-serif" font-size="10" fill="#4a6b54" font-weight="normal" text-anchor="middle">保证跨块句子完整</text><rect x="80" y="330" width="190" height="56" rx="8" fill="#ffffff" stroke="#5ba36b" stroke-width="1.5" filter="url(#shadow)"/><text x="175" y="350" font-family="-apple-system, PingFang SC, sans-serif" font-size="13" fill="#5ba36b" font-weight="600" text-anchor="middle">size=300</text><text x="175" y="366" font-family="-apple-system, PingFang SC, sans-serif" font-size="10" fill="#4a6b54" font-weight="normal" text-anchor="middle">每块约300字</text><text x="175" y="379" font-family="-apple-system, PingFang SC, sans-serif" font-size="10" fill="#4a6b54" font-weight="normal" text-anchor="middle">(2-3个自然段)</text><rect x="290" y="330" width="190" height="56" rx="8" fill="#ffffff" stroke="#3d7a5d" stroke-width="1.5" filter="url(#shadow)"/><text x="385" y="350" font-family="-apple-system, PingFang SC, sans-serif" font-size="13" fill="#3d7a5d" font-weight="600" text-anchor="middle">overlap=50</text><text x="385" y="366" font-family="-apple-system, PingFang SC, sans-serif" font-size="10" fill="#4a6b54" font-weight="normal" text-anchor="middle">重叠50字</text><text x="385" y="379" font-family="-apple-system, PingFang SC, sans-serif" font-size="10" fill="#4a6b54" font-weight="normal" text-anchor="middle">防止断句</text><rect x="500" y="330" width="190" height="56" rx="8" fill="#ffffff" stroke="#2d5a3d" stroke-width="1.5" filter="url(#shadow)"/><text x="595" y="350" font-family="-apple-system, PingFang SC, sans-serif" font-size="13" fill="#2d5a3d" font-weight="600" text-anchor="middle">策略</text><text x="595" y="366" font-family="-apple-system, PingFang SC, sans-serif" font-size="10" fill="#4a6b54" font-weight="normal" text-anchor="middle">先按字符切</text><text x="595" y="379" font-family="-apple-system, PingFang SC, sans-serif" font-size="10" fill="#4a6b54" font-weight="normal" text-anchor="middle">跑通后再优化结构化切块</text></svg>