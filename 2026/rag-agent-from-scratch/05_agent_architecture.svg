-weight="600" text-anchor="start">③ 执行工具调用 + 回填结果</text><text x="65" y="340" font-family="-apple-system, PingFang SC, sans-serif" font-size="10" fill="#4a6b54" font-weight="normal" text-anchor="start">messages.append(msg)  →  messages.append(tool_result)</text><text x="65" y="356" font-family="-apple-system, PingFang SC, sans-serif" font-size="10" fill="#4a6b54" font-weight="normal" text-anchor="start">search_knowledge_base(query) → 检索结果拼入上下文</text><rect x="55" y="378" width="570" height="40" rx="8" fill="#ffffff" stroke="#c8ddd0" stroke-width="1.5" filter="url(#shadow)"/><text x="65" y="403" font-family="-apple-system, PingFang SC, sans-serif" font-size="11" fill="#4a6b54" font-weight="normal" text-anchor="start">④ 继续下一轮循环 (messages 变长，模型看到完整历史)</text><rect x="55" y="430" width="570" height="35" rx="8" fill="#fff3cd" stroke="#e8b84a" stroke-width="1.2" filter="url(#shadow)"/><text x="65" y="452" font-family="-apple-system, PingFang SC, sans-serif" font-size="11" fill="#856404" font-weight="normal" text-anchor="start">⚠ max_loops=5 死循环保险丝 | 超限强制终止</text><rect x="55" y="475" width="570" height="22" rx="4" fill="#1a3e28" stroke="none" stroke-width="1.5" filter="url(#shadow)"/><text x="340" y="490" font-family="-apple-system, PingFang SC, sans-serif" font-size="11" fill="#fff" font-weight="500" text-anchor="middle">核心：二十行代码实现完整的 ReAct 循环</text></svg>