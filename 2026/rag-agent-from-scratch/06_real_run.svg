<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" width="680" height="360">
<defs>
  <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" style="stop-color:#e8f0ea;stop-opacity:0.6"/>
    <stop offset="100%" style="stop-color:#f5faf7;stop-opacity:1"/>
  </linearGradient>
  <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1a3e28" flood-opacity="0.08"/>
  </filter>
  <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#5a8a6a"/>
  </marker>
  <marker id="arrowhead_accent" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#5ba36b"/>
  </marker>
</defs>
<rect width="680" height="360" fill="url(#bgGrad)" rx="12"/>
<text x="340.0" y="28" font-family="-apple-system, PingFang SC, sans-serif" font-size="19" fill="#1a3e28" font-weight="700" text-anchor="middle">真实运行对比：Agent 的自主判断</text><rect x="25" y="50" width="315" height="145" rx="8" fill="#ffffff" stroke="#2d5a3d" stroke-width="1.5" filter="url(#shadow)"/><text x="182" y="74" font-family="-apple-system, PingFang SC, sans-serif" font-size="13" fill="#2d5a3d" font-weight="600" text-anchor="middle">问：「入职半年能休年假吗？」</text><rect x="38" y="94" width="70" height="26" rx="4" fill="#3d7a5d" stroke="none" stroke-width="1.5" filter="url(#shadow)"/><text x="73" y="111" font-family="-apple-system, PingFang SC, sans-serif" font-size="10" fill="#fff" font-weight="600" text-anchor="middle">Loop 1</text><text x="118" y="111" font-family="-apple-system, PingFang SC, sans-serif" font-size="11" fill="#1a2e1f" font-weight="normal" text-anchor="start">search: "年假 入职 年限"</text><rect x="38" y="128" width="70" height="26" rx="4" fill="#3d7a5d" stroke="none" stroke-width="1.5" filter="url(#shadow)"/><text x="73" y="145" font-family="-apple-system, PingFang SC, sans-serif" font-size="10" fill="#fff" font-weight="600" text-anchor="middle">Loop 2</text><text x="118" y="145" font-family="-apple-system, PingFang SC, sans-serif" font-size="11" fill="#1a2e1f" font-weight="normal" text-anchor="start">search: "年假申请条件"</text><rect x="38" y="162" width="70" height="26" rx="4" fill="#5ba36b" stroke="none" stroke-width="1.5" filter="url(#shadow)"/><text x="73" y="179" font-family="-apple-system, PingFang SC, sans-serif" font-size="10" fill="#fff" font-weight="600" text-anchor="middle">Result</text><text x="118" y="179" font-family="-apple-system, PingFang SC, sans-serif" font-size="11" fill="#1a2e1f" font-weight="normal" text-anchor="start">基于查到的条款回答 ✓</text><rect x="340" y="50" width="315" height="145" rx="8" fill="#ffffff" stroke="#5ba36b" stroke-width="1.5" filter="url(#shadow)"/><text x="497" y="74" font-family="-apple-system, PingFang SC, sans-serif" font-size="13" fill="#5ba36b" font-weight="600" text-anchor="middle">问：「你是谁？」</text><rect x="353" y="94" width="70" height="26" rx="4" fill="#d4edda" stroke="#5ba36b" stroke-width="1.5" filter="url(#shadow)"/><text x="388" y="110" font-family="-apple-system, PingFang SC, sans-serif" font-size="10" fill="#5ba36b" font-weight="600" text-anchor="middle">Direct</text><text x="428" y="110" font-family="-apple-system, PingFang SC, sans-serif" font-size="11" fill="#1a2e1f" font-weight="normal" text-anchor="start">零次检索，直接回答 ✓</text><text x="428" y="132" font-family="-apple-system, PingFang SC, sans-serif" font-size="10" fill="#4a6b54" font-weight="normal" text-anchor="start">「我是公司制度助手…」</text><line x1="340" y1="122" x2="335" y2="122" stroke="#5a8a6a" stroke-width="1.5" stroke-dasharray="4,3"/><rect x="25" y="210" width="630" height="55" rx="8" fill="#e8f0ea" stroke="#2d5a3d" stroke-width="1.2" filter="url(#shadow)"/><text x="340" y="234" font-family="-apple-system, PingFang SC, sans-serif" font-size="14" fill="#1a3e28" font-weight="600" text-anchor="middle">同一个程序，不同问题触发完全不同的行为路径</text><text x="340" y="254" font-family="-apple-system, PingFang SC, sans-serif" font-size="12" fill="#4a6b54" font-weight="normal" text-anchor="middle">差异来自模型对任务的理解，不是你写的 if-else</text><rect x="25" y="280" width="630" height="65" rx="8" fill="#fff8f0" stroke="#e8b84a" stroke-width="1.2" filter="url(#shadow)"/><text x="340" y="302" font-family="-apple-system, PingFang SC, sans-serif" font-size="13" fill="#856404" font-weight="600" text-anchor="middle">固定流程 RAG 做不到这一点</text><text x="340" y="322" font-family="-apple-system, PingFang SC, sans-serif" font-size="11" fill="#4a6b54" font-weight="normal" text-anchor="middle">不管问什么都先检索 → 「你是谁」也会去知识库里捞一遍 → 反而可能带偏回答</text></svg>