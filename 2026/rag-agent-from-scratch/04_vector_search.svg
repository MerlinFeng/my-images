<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="700" height="380">
<defs>
  <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" style="stop-color:#e8f0ea;stop-opacity:0.6"/>
    <stop offset="100%" style="stop-color:#f5faf7;stop-opacity:1"/>
  </linearGradient>
  <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1a3e28" flood-opacity="0.08"/>
  </filter>
  <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#5a8a6a"/>
  </marker>
  <marker id="arrowhead_accent" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#5ba36b"/>
  </marker>
</defs>
<rect width="700" height="380" fill="url(#bgGrad)" rx="12"/>
<text x="350.0" y="30" font-family="-apple-system, PingFang SC, sans-serif" font-size="19" fill="#1a3e28" font-weight="700" text-anchor="middle">向量检索原理：余弦相似度</text><rect x="30" y="55" width="160" height="100" rx="8" fill="#d4edda" stroke="#5ba36b" stroke-width="2" filter="url(#shadow)"/><text x="110" y="88" font-family="-apple-system, PingFang SC, sans-serif" font-size="14" fill="#2d5a3d" font-weight="600" text-anchor="middle">Query</text><text x="110" y="110" font-family="-apple-system, PingFang SC, sans-serif" font-size="10" fill="#4a6b54" font-weight="normal" text-anchor="middle">[0.12, -0.34, ...]</text><text x="110" y="128" font-family="-apple-system, PingFang SC, sans-serif" font-size="10" fill="#4a6b54" font-weight="normal" text-anchor="middle">(问题向量)</text><line x1="195" y1="105" x2="240" y2="105" stroke="#2d5a3d" stroke-width="2" marker-end="url(#arrowhead)"/><text x="217" y="97" font-family="-apple-system, PingFang SC, sans-serif" font-size="9" fill="#2d5a3d" font-weight="normal" text-anchor="middle">cosine_sim()</text><rect x="245" y="55" width="200" height="100" rx="8" fill="#ffffff" stroke="#2d5a3d" stroke-width="1.5" filter="url(#shadow)"/><text x="345" y="78" font-family="-apple-system, PingFang SC, sans-serif" font-size="13" fill="#2d5a3d" font-weight="600" text-anchor="middle">VectorStore</text><text x="255" y="96" font-family="-apple-system, PingFang SC, sans-serif" font-size="10" fill="#1a2e1f" font-weight="normal" text-anchor="middle">Doc A [0.11,...]</text><text x="415" y="96" font-family="-apple-system, PingFang SC, sans-serif" font-size="10" fill="#5ba36b" font-weight="600" text-anchor="middle">0.98</text><text x="255" y="112" font-family="-apple-system, PingFang SC, sans-serif" font-size="10" fill="#1a2e1f" font-weight="normal" text-anchor="middle">Doc B [-0.05,...]</text><text x="415" y="112" font-family="-apple-system, PingFang SC, sans-serif" font-size="10" fill="#3d7a5d" font-weight="600" text-anchor="middle">0.72</text><text x="255" y="128" font-family="-apple-system, PingFang SC, sans-serif" font-size="10" fill="#1a2e1f" font-weight="normal" text-anchor="middle">Doc C [0.33,...]</text><text x="415" y="128" font-family="-apple-system, PingFang SC, sans-serif" font-size="10" fill="#4a6b54" font-weight="600" text-anchor="middle">0.41</text><text x="255" y="144" font-family="-apple-system, PingFang SC, sans-serif" font-size="10" fill="#1a2e1f" font-weight="normal" text-anchor="middle">Doc D [-0.21,...]</text><text x="415" y="144" font-family="-apple-system, PingFang SC, sans-serif" font-size="10" fill="#4a6b54" font-weight="600" text-anchor="middle">0.15</text><line x1="450" y1="105" x2="495" y2="105" stroke="#2d5a3d" stroke-width="2" marker-end="url(#arrowhead)"/><text x="472" y="97" font-family="-apple-system, PingFang SC, sans-serif" font-size="9" fill="#2d5a3d" font-weight="normal" text-anchor="middle">top_k=3</text><rect x="500" y="55" width="175" height="100" rx="8" fill="#d4edda" stroke="#5ba36b" stroke-width="2" filter="url(#shadow)"/><text x="587" y="80" font-family="-apple-system, PingFang SC, sans-serif" font-size="13" fill="#2d5a3d" font-weight="600" text-anchor="middle">Top 3 结果</text><text x="587" y="102" font-family="-apple-system, PingFang SC, sans-serif" font-size="11" fill="#1a2e1f" font-weight="normal" text-anchor="middle">1. Doc A (0.98)</text><text x="587" y="118" font-family="-apple-system, PingFang SC, sans-serif" font-size="11" fill="#1a2e1f" font-weight="normal" text-anchor="middle">2. Doc B (0.72)</text><text x="587" y="134" font-family="-apple-system, PingFang SC, sans-serif" font-size="11" fill="#1a2e1f" font-weight="normal" text-anchor="middle">3. Doc C (0.41)</text><rect x="80" y="185" width="540" height="80" rx="8" fill="#ffffff" stroke="#c8ddd0" stroke-width="1.5" filter="url(#shadow)"/><text x="350" y="210" font-family="-apple-system, PingFang SC, sans-serif" font-size="14" fill="#1a3e28" font-weight="600" text-anchor="middle">余弦相似度公式</text><text x="350" y="237" font-family="-apple-system, PingFang SC, sans-serif" font-size="15" fill="#2d5a3d" font-weight="500" text-anchor="middle">sim(A,B) = (A · B) / (||A|| × ||B||)</text><text x="350" y="257" font-family="-apple-system, PingFang SC, sans-serif" font-size="11" fill="#4a6b54" font-weight="normal" text-anchor="middle">值域 [-1, 1]，越接近 1 表示语义越相近</text><rect x="50" y="285" width="200" height="80" rx="8" fill="#ffffff" stroke="#3d7a5d" stroke-width="1.5" filter="url(#shadow)"/><text x="150" y="305" font-family="-apple-system, PingFang SC, sans-serif" font-size="13" fill="#3d7a5d" font-weight="600" text-anchor="middle">暴力扫描</text><text x="150" y="323" font-family="-apple-system, PingFang SC, sans-serif" font-size="10" fill="#4a6b54" font-weight="normal" text-anchor="middle">O(n) 全量计算</text><text x="150" y="337" font-family="-apple-system, PingFang SC, sans-serif" font-size="10" fill="#4a6b54" font-weight="normal" text-anchor="middle">小数据量够用</text><text x="150" y="351" font-family="-apple-system, PingFang SC, sans-serif" font-size="10" fill="#4a6b54" font-weight="normal" text-anchor="middle">大数据换索引加速</text><rect x="265" y="285" width="200" height="80" rx="8" fill="#ffffff" stroke="#5ba36b" stroke-width="1.5" filter="url(#shadow)"/><text x="365" y="305" font-family="-apple-system, PingFang SC, sans-serif" font-size="13" fill="#5ba36b" font-weight="600" text-anchor="middle">只看方向</text><text x="365" y="323" font-family="-apple-system, PingFang SC, sans-serif" font-size="10" fill="#4a6b54" font-weight="normal" text-anchor="middle">不管向量长度</text><text x="365" y="337" font-family="-apple-system, PingFang SC, sans-serif" font-size="10" fill="#4a6b54" font-weight="normal" text-anchor="middle">只比较方向一致性</text><text x="365" y="351" font-family="-apple-system, PingFang SC, sans-serif" font-size="10" fill="#4a6b54" font-weight="normal" text-anchor="middle">天然适合语义匹配</text><rect x="480" y="285" width="200" height="80" rx="8" fill="#ffffff" stroke="#2d5a3d" stroke-width="1.5" filter="url(#shadow)"/><text x="580" y="305" font-family="-apple-system, PingFang SC, sans-serif" font-size="13" fill="#2d5a3d" font-weight="600" text-anchor="middle">核心就三行</text><text x="580" y="323" font-family="-apple-system, PingFang SC, sans-serif" font-size="10" fill="#4a6b54" font-weight="normal" text-anchor="middle">numpy 点积 + 归一化</text><text x="580" y="337" font-family="-apple-system, PingFang SC, sans-serif" font-size="10" fill="#4a6b54" font-weight="normal" text-anchor="middle">argsort 取 top-k</text><text x="580" y="351" font-family="-apple-system, PingFang SC, sans-serif" font-size="10" fill="#4a6b54" font-weight="normal" text-anchor="middle">三十行写完整个库</text></svg>