<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400">
<defs>
  <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" style="stop-color:#e8f0ea;stop-opacity:0.6"/>
    <stop offset="100%" style="stop-color:#f5faf7;stop-opacity:1"/>
  </linearGradient>
  <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1a3e28" flood-opacity="0.08"/>
  </filter>
  <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#5a8a6a"/>
  </marker>
  <marker id="arrowhead_accent" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#5ba36b"/>
  </marker>
</defs>
<rect width="680" height="400" fill="url(#bgGrad)" rx="12"/>
<text x="340.0" y="28" font-family="-apple-system, PingFang SC, sans-serif" font-size="19" fill="#1a3e28" font-weight="700" text-anchor="middle">从手写版到生产版：差距与升级方向</text><rect x="25" y="52" width="630" height="36" rx="6" fill="#1a3e28" stroke="none" stroke-width="1.5" filter="url(#shadow)"/><text x="100.0" y="76" font-family="-apple-system, PingFang SC, sans-serif" font-size="13" fill="#fff" font-weight="600" text-anchor="middle">维度</text><text x="280.0" y="76" font-family="-apple-system, PingFang SC, sans-serif" font-size="13" fill="#fff" font-weight="600" text-anchor="middle">手写版（当前）</text><text x="540.0" y="76" font-family="-apple-system, PingFang SC, sans-serif" font-size="13" fill="#fff" font-weight="600" text-anchor="middle">生产版升级方案</text><rect x="25" y="92" width="630" height="46" rx="4" fill="#d4edda" stroke="#c8ddd0" stroke-width="1.5" filter="url(#shadow)"/><text x="100" y="121.0" font-family="-apple-system, PingFang SC, sans-serif" font-size="12" fill="#2d5a3d" font-weight="600" text-anchor="middle">错误处理</text><text x="240.0" y="121.0" font-family="-apple-system, PingFang SC, sans-serif" font-size="11" fill="#c0392b" font-weight="normal" text-anchor="middle">✗ 无 try-catch</text><text x="500.0" y="121.0" font-family="-apple-system, PingFang SC, sans-serif" font-size="11" fill="#1a2e1f" font-weight="normal" text-anchor="middle">每步包 try + 重试 + 降级</text><rect x="25" y="142" width="630" height="46" rx="4" fill="#ffffff" stroke="#c8ddd0" stroke-width="1.5" filter="url(#shadow)"/><text x="100" y="171.0" font-family="-apple-system, PingFang SC, sans-serif" font-size="12" fill="#2d5a3d" font-weight="600" text-anchor="middle">向量存储</text><text x="240.0" y="171.0" font-family="-apple-system, PingFang SC, sans-serif" font-size="11" fill="#4a6b54" font-weight="normal" text-anchor="middle">numpy 内存数组</text><text x="500.0" y="171.0" font-family="-apple-system, PingFang SC, sans-serif" font-size="11" fill="#1a2e1f" font-weight="normal" text-anchor="middle">Milvus / Pinecone / sqlite-vec 持久化</text><rect x="25" y="192" width="630" height="46" rx="4" fill="#d4edda" stroke="#c8ddd0" stroke-width="1.5" filter="url(#shadow)"/><text x="100" y="221.0" font-family="-apple-system, PingFang SC, sans-serif" font-size="12" fill="#2d5a3d" font-weight="600" text-anchor="middle">Embedding 缓存</text><text x="240.0" y="221.0" font-family="-apple-system, PingFang SC, sans-serif" font-size="11" fill="#4a6b54" font-weight="normal" text-anchor="middle">每次重新计算</text><text x="500.0" y="221.0" font-family="-apple-system, PingFang SC, sans-serif" font-size="11" fill="#1a2e1f" font-weight="normal" text-anchor="middle">LRU 缓存层，命中省一半费用</text><rect x="25" y="242" width="630" height="46" rx="4" fill="#ffffff" stroke="#c8ddd0" stroke-width="1.5" filter="url(#shadow)"/><text x="100" y="271.0" font-family="-apple-system, PingFang SC, sans-serif" font-size="12" fill="#2d5a3d" font-weight="600" text-anchor="middle">评估体系</text><text x="240.0" y="271.0" font-family="-apple-system, PingFang SC, sans-serif" font-size="11" fill="#4a6b54" font-weight="normal" text-anchor="middle">无</text><text x="500.0" y="271.0" font-family="-apple-system, PingFang SC, sans-serif" font-size="11" fill="#1a2e1f" font-weight="normal" text-anchor="middle">Ragas 评估集 + 定期准确率检查</text><rect x="25" y="292" width="630" height="46" rx="4" fill="#d4edda" stroke="#c8ddd0" stroke-width="1.5" filter="url(#shadow)"/><text x="100" y="321.0" font-family="-apple-system, PingFang SC, sans-serif" font-size="12" fill="#2d5a3d" font-weight="600" text-anchor="middle">切块策略</text><text x="240.0" y="321.0" font-family="-apple-system, PingFang SC, sans-serif" font-size="11" fill="#4a6b54" font-weight="normal" text-anchor="middle">按字符硬切</text><text x="500.0" y="321.0" font-family="-apple-system, PingFang SC, sans-serif" font-size="11" fill="#1a2e1f" font-weight="normal" text-anchor="middle">按段落/标题层级结构化切块</text><rect x="25" y="342" width="630" height="46" rx="4" fill="#ffffff" stroke="#c8ddd0" stroke-width="1.5" filter="url(#shadow)"/><text x="100" y="371.0" font-family="-apple-system, PingFang SC, sans-serif" font-size="12" fill="#2d5a3d" font-weight="600" text-anchor="middle">并发能力</text><text x="240.0" y="371.0" font-family="-apple-system, PingFang SC, sans-serif" font-size="11" fill="#4a6b54" font-weight="normal" text-anchor="middle">单线程串行</text><text x="500.0" y="371.0" font-family="-apple-system, PingFang SC, sans-serif" font-size="11" fill="#1a2e1f" font-weight="normal" text-anchor="middle">异步 + 批量 embedding + 并发检索</text><rect x="25" y="402" width="630" height="38" rx="6" fill="#1a3e28" stroke="none" stroke-width="1.5" filter="url(#shadow)"/><text x="340" y="425" font-family="-apple-system, PingFang SC, sans-serif" font-size="12" fill="#fff" font-weight="500" text-anchor="middle">手写一遍的价值：升级时你补的是自己摸过的短板，不是背最佳实践</text></svg>