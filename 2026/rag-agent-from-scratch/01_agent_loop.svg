<text x="350.0" y="174.0" font-family="-apple-system, PingFang SC, sans-serif" font-size="11" fill="#4a6b54" font-weight="normal" text-anchor="middle">Function Calling</text><rect x="95.0" y="238.0" width="170" height="44" rx="8" fill="#e8f0ea" stroke="#2d5a3d" stroke-width="1.5" filter="url(#shadow)"/>
<text x="180.0" y="252.0" font-family="-apple-system, PingFang SC, sans-serif" font-size="14" fill="#1a2e1f" font-weight="600" text-anchor="middle">执行检索工具</text>
<text x="180.0" y="274.0" font-family="-apple-system, PingFang SC, sans-serif" font-size="11" fill="#4a6b54" font-weight="normal" text-anchor="middle">search_knowledge_base</text><rect x="435.0" y="238.0" width="170" height="44" rx="8" fill="#d4edda" stroke="#2d5a3d" stroke-width="1.5" filter="url(#shadow)"/>
<text x="520.0" y="252.0" font-family="-apple-system, PingFang SC, sans-serif" font-size="14" fill="#1a2e1f" font-weight="600" text-anchor="middle">直接回答</text>
