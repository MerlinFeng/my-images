<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" width="700" height="480">
<defs>
  <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" style="stop-color:#e8f0ea;stop-opacity:0.6"/>
    <stop offset="100%" style="stop-color:#f5faf7;stop-opacity:1"/>
  </linearGradient>
  <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1a3e28" flood-opacity="0.08"/>
  </filter>
  <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#5a8a6a"/>
  </marker>
  <marker id="arrowhead_accent" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#5ba36b"/>
  </marker>
</defs>
<rect width="700" height="480" fill="url(#bgGrad)" rx="12"/>
<text x="350.0" y="35" font-family="-apple-system, PingFang SC, sans-serif" font-size="20" fill="#1a3e28" font-weight="700" text-anchor="middle">RAG Agent 循环流程</text><rect x="250.0" y="58.0" width="200" height="44" rx="8" fill="#d4edda" stroke="#2d5a3d" stroke-width="1.5" filter="url(#shadow)"/>
<text x="350.0" y="80.0" font-family="-apple-system, PingFang SC, sans-serif" font-size="14" fill="#1a2e1f" font-weight="600" text-anchor="middle">用户提问</text><rect x="240.0" y="136.0" width="220" height="48" rx="8" fill="#ffffff" stroke="#2d5a3d" stroke-width="1.5" filter="url(#shadow)"/>
