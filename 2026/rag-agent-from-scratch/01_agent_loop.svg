<text x="350.0" y="369.0" font-family="-apple-system, PingFang SC, sans-serif" font-size="11" fill="#4a6b54" font-weight="normal" text-anchor="middle">够→回答 / 不够→再查</text><rect x="260.0" y="422.0" width="180" height="36" rx="8" fill="#5ba36b" stroke="#2d5a3d" stroke-width="1.5" filter="url(#shadow)"/>
