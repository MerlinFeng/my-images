<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440">
  <defs>
    <marker id="ar4" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6b5b95"/>
    </marker>
  </defs>
  <text x="360" y="30" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#4a3f6e">MCP：Agent 的 USB-C 接口</text>
  <text x="360" y="52" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11.5" fill="#7a7390">N×M 的集成地狱 → N+M 的标准协议</text>

  <!-- Host -->
  <rect x="40" y="80" width="220" height="300" rx="14" fill="#ece7f5" stroke="#b8aed4" stroke-width="1.2"/>
  <text x="150" y="108" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#4a3f6e">Host 宿主应用</text>
  <text x="150" y="128" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10.5" fill="#7a7390">Claude Desktop / 你的 Agent 框架</text>

  <!-- Clients inside host -->
  <g font-family="Inter,Arial,sans-serif" font-size="11.5">
    <rect x="65" y="150" width="170" height="48" rx="8" fill="#ffffff" stroke="#6b5b95" stroke-width="1.2"/>
    <text x="150" y="171" text-anchor="middle" fill="#4a3f6e" font-weight="600">MCP Client 1</text>
    <text x="150" y="188" text-anchor="middle" font-size="9.5" fill="#7a7390">一对一连接</text>

    <rect x="65" y="215" width="170" height="48" rx="8" fill="#ffffff" stroke="#6b5b95" stroke-width="1.2"/>
    <text x="150" y="236" text-anchor="middle" fill="#4a3f6e" font-weight="600">MCP Client 2</text>
    <text x="150" y="253" text-anchor="middle" font-size="9.5" fill="#7a7390">一对一连接</text>

    <rect x="65" y="280" width="170" height="48" rx="8" fill="#ffffff" stroke="#6b5b95" stroke-width="1.2"/>
    <text x="150" y="301" text-anchor="middle" fill="#4a3f6e" font-weight="600">MCP Client 3</text>
    <text x="150" y="318" text-anchor="middle" font-size="9.5" fill="#7a7390">一对一连接</text>
  </g>

  <!-- Servers -->
  <g font-family="Inter,Arial,sans-serif" font-size="11.5">
    <rect x="470" y="80" width="210" height="80" rx="12" fill="#4a3f6e"/>
    <text x="575" y="108" text-anchor="middle" fill="#ffffff" font-weight="700">MCP Server A</text>
    <text x="575" y="127" text-anchor="middle" font-size="10" fill="#cfc8e8">GitHub / Slack / Notion</text>
    <text x="575" y="145" text-anchor="middle" font-size="9.5" fill="#cfc8e8">Tools · Resources · Prompts</text>

    <rect x="470" y="190" width="210" height="80" rx="12" fill="#6b5b95"/>
    <text x="575" y="218" text-anchor="middle" fill="#ffffff" font-weight="700">MCP Server B</text>
    <text x="575" y="237" text-anchor="middle" font-size="10" fill="#e6e1f2">数据库 / 内部 API</text>
    <text x="575" y="255" text-anchor="middle" font-size="9.5" fill="#e6e1f2">Tools · Resources · Prompts</text>

    <rect x="470" y="300" width="210" height="80" rx="12" fill="#8b7ab8"/>
    <text x="575" y="328" text-anchor="middle" fill="#ffffff" font-weight="700">MCP Server C</text>
    <text x="575" y="347" text-anchor="middle" font-size="10" fill="#ffffff">浏览器 / 代码执行</text>
    <text x="575" y="365" text-anchor="middle" font-size="9.5" fill="#ffffff">Tools · Resources · Prompts</text>
  </g>

  <!-- connections -->
  <line x1="235" y1="174" x2="465" y2="120" stroke="#6b5b95" stroke-width="1.8" marker-end="url(#ar4)"/>
  <line x1="235" y1="239" x2="465" y2="230" stroke="#6b5b95" stroke-width="1.8" marker-end="url(#ar4)"/>
  <line x1="235" y1="304" x2="465" y2="340" stroke="#6b5b95" stroke-width="1.8" marker-end="url(#ar4)"/>

  <text x="350" y="150" font-family="Inter,Arial,sans-serif" font-size="9.5" fill="#7a7390">stdio / HTTP</text>
  <text x="350" y="232" font-family="Inter,Arial,sans-serif" font-size="9.5" fill="#7a7390">stdio / HTTP</text>
  <text x="350" y="318" font-family="Inter,Arial,sans-serif" font-size="9.5" fill="#7a7390">stdio / HTTP</text>

  <text x="360" y="420" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11.5" fill="#7a7390">工具方实现一次 Server，所有框架都能用</text>
</svg>