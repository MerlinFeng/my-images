<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420">
  <defs>
    <marker id="ar5" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6b5b95"/>
    </marker>
  </defs>
  <text x="360" y="30" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#4a3f6e">记忆机制：LLM 是无状态的</text>

  <!-- center: context window -->
  <rect x="250" y="70" width="220" height="280" rx="14" fill="#4a3f6e"/>
  <text x="360" y="100" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff">Context Window</text>
  <text x="360" y="120" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10.5" fill="#cfc8e8">128K token 也不是无限的</text>
  <g font-family="Menlo,monospace" font-size="10" fill="#e6e1f2">
    <rect x="270" y="140" width="180" height="34" rx="6" fill="#6b5b95" opacity="0.5"/>
    <text x="360" y="161" text-anchor="middle">系统 prompt + 工具定义</text>
    <rect x="270" y="184" width="180" height="34" rx="6" fill="#6b5b95" opacity="0.65"/>
    <text x="360" y="205" text-anchor="middle">历史对话（短期记忆）</text>
    <rect x="270" y="228" width="180" height="34" rx="6" fill="#8b7ab8" opacity="0.75"/>
    <text x="360" y="249" text-anchor="middle">检索来的记忆块（长期）</text>
    <rect x="270" y="272" width="180" height="34" rx="6" fill="#b8aed4" opacity="0.85"/>
    <text x="360" y="293" text-anchor="middle">当前用户输入</text>
  </g>
  <text x="360" y="330" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" fill="#cfc8e8">塞得越多，中间越容易被忽略</text>

  <!-- left: short term -->
  <rect x="20" y="120" width="190" height="120" rx="12" fill="#ffffff" stroke="#6b5b95" stroke-width="1.3"/>
  <text x="115" y="146" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#4a3f6e">短期记忆</text>
  <text x="115" y="168" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10.5" fill="#36304a">把历史对话</text>
  <text x="115" y="186" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10.5" fill="#36304a">直接拼进 prompt</text>
  <text x="115" y="210" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" fill="#a8625e">简单粗暴，但有上限</text>

  <!-- right: long term -->
  <rect x="510" y="100" width="190" height="160" rx="12" fill="#ffffff" stroke="#8b7ab8" stroke-width="1.3"/>
  <text x="605" y="126" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#4a3f6e">长期记忆</text>
  <text x="605" y="148" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10.5" fill="#36304a">向量库 + 语义检索</text>
  <text x="605" y="172" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10.5" fill="#36304a">写入闸门：什么该记</text>
  <text x="605" y="190" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10.5" fill="#36304a">整合压缩：经验沉淀</text>
  <text x="605" y="214" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" fill="#4a3f6e">Milvus / Zep / MemGPT</text>
  <text x="605" y="236" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" fill="#a8625e">垃圾进，垃圾出</text>

  <!-- arrows -->
  <line x1="210" y1="180" x2="245" y2="180" stroke="#6b5b95" stroke-width="1.8" marker-end="url(#ar5)"/>
  <line x1="510" y1="180" x2="475" y2="180" stroke="#8b7ab8" stroke-width="1.8" marker-end="url(#ar5)"/>

  <rect x="90" y="375" width="540" height="30" rx="15" fill="#ece7f5"/>
  <text x="360" y="394" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11.5" fill="#4a3f6e">「记住」的真相：每次都是重新塞进 prompt</text>
</svg>