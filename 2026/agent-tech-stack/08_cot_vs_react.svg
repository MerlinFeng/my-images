<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330">
  <text x="360" y="30" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#4a3f6e">从 CoT 到 ReAct：补上跟世界交互的那一半</text>

  <!-- CoT -->
  <rect x="30" y="60" width="320" height="210" rx="14" fill="#f9f2f1" stroke="#a8625e" stroke-width="1.3"/>
  <text x="190" y="88" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#a8625e">Chain-of-Thought</text>
  <text x="190" y="108" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10.5" fill="#7a7390">只能在脑子里推演</text>
  <g font-family="Menlo,monospace" font-size="10.5" fill="#36304a">
    <rect x="60" y="125" width="260" height="30" rx="6" fill="#fff" stroke="#a8625e" stroke-width="0.8"/>
    <text x="190" y="144" text-anchor="middle">一步步想：A → B → C</text>
    <rect x="60" y="165" width="260" height="30" rx="6" fill="#fff" stroke="#a8625e" stroke-width="0.8"/>
    <text x="190" y="184" text-anchor="middle">全程不接触外部世界</text>
    <rect x="60" y="205" width="260" height="30" rx="6" fill="#fff" stroke="#a8625e" stroke-width="0.8" stroke-dasharray="3,2"/>
    <text x="190" y="224" text-anchor="middle" fill="#a8625e">查今天股价？做不到</text>
  </g>
  <text x="190" y="255" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10.5" fill="#7a7390">知识停在训练数据里</text>

  <!-- ReAct -->
  <rect x="370" y="60" width="320" height="210" rx="14" fill="#ece7f5" stroke="#6b5b95" stroke-width="1.5"/>
  <text x="530" y="88" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#4a3f6e">ReAct</text>
  <text x="530" y="108" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10.5" fill="#7a7390">推理 + 行动交替进行</text>
  <g font-family="Menlo,monospace" font-size="10.5" fill="#36304a">
    <rect x="400" y="125" width="260" height="30" rx="6" fill="#fff" stroke="#6b5b95" stroke-width="0.8"/>
    <text x="530" y="144" text-anchor="middle">Thought → Action → Observation</text>
    <rect x="400" y="165" width="260" height="30" rx="6" fill="#fff" stroke="#6b5b95" stroke-width="0.8"/>
    <text x="530" y="184" text-anchor="middle">每步都能调用真实工具</text>
    <rect x="400" y="205" width="260" height="30" rx="6" fill="#6b5b95"/>
    <text x="530" y="224" text-anchor="middle" fill="#fff">查股价？调 API 就行</text>
  </g>
  <text x="530" y="255" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10.5" fill="#4a3f6e">知识可以实时获取</text>

  <!-- arrow between -->
  <defs>
    <marker id="ar8" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6b5b95"/>
    </marker>
  </defs>
  <line x1="352" y1="165" x2="368" y2="165" stroke="#6b5b95" stroke-width="2" marker-end="url(#ar8)"/>

  <rect x="110" y="290" width="500" height="28" rx="14" fill="#ece7f5"/>
  <text x="360" y="308" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" fill="#4a3f6e">CoT 是 2022 年的发现，ReAct 让它长出了手脚</text>
</svg>