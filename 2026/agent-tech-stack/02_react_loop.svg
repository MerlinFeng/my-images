<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430">
  <defs>
    <marker id="ar2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6b5b95"/>
    </marker>
  </defs>
  <text x="360" y="30" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#4a3f6e">ReAct 的本质：一场精心设计的文本接龙</text>

  <!-- LLM box -->
  <rect x="40" y="70" width="180" height="290" rx="14" fill="#4a3f6e"/>
  <text x="130" y="100" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#ffffff">LLM</text>
  <text x="130" y="125" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" fill="#cfc8e8">预测下一个 token</text>
  <g font-family="Menlo,monospace" font-size="10.5" fill="#e6e1f2">
    <text x="130" y="160" text-anchor="middle">生成 Thought</text>
    <text x="130" y="180" text-anchor="middle">生成 Action</text>
    <text x="130" y="200" text-anchor="middle">生成 Action Input</text>
    <text x="130" y="220" text-anchor="middle">（自动停下）</text>
    <text x="130" y="252" text-anchor="middle">……结果回填后……</text>
    <text x="130" y="284" text-anchor="middle">继续生成</text>
    <text x="130" y="304" text-anchor="middle">或输出 Final Answer</text>
  </g>

  <!-- Code box -->
  <rect x="500" y="70" width="180" height="290" rx="14" fill="#ffffff" stroke="#6b5b95" stroke-width="1.5"/>
  <text x="590" y="100" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#4a3f6e">你的代码</text>
  <g font-family="Menlo,monospace" font-size="10.5" fill="#36304a">
    <text x="590" y="135" text-anchor="middle">解析 Action</text>
    <text x="590" y="160" text-anchor="middle">执行工具调用</text>
    <text x="590" y="185" text-anchor="middle">拿到返回结果</text>
    <text x="590" y="210" text-anchor="middle">拼成 Observation</text>
    <text x="590" y="235" text-anchor="middle">追加到 prompt 末尾</text>
    <text x="590" y="272" text-anchor="middle">再调一次 LLM</text>
    <text x="590" y="305" text-anchor="middle" fill="#a8625e">循环次数 / Token 上限</text>
  </g>

  <!-- Arrows -->
  <path d="M 220 150 L 495 150" stroke="#6b5b95" stroke-width="2" fill="none" marker-end="url(#ar2)"/>
  <text x="358" y="140" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" fill="#4a3f6e">Thought / Action / Input</text>

  <path d="M 500 250 L 225 250" stroke="#8b7ab8" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#ar2)"/>
  <text x="358" y="240" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" fill="#4a3f6e">Observation（结果回填）</text>

  <!-- Bottom note -->
  <rect x="90" y="385" width="540" height="32" rx="16" fill="#ece7f5"/>
  <text x="360" y="406" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11.5" fill="#4a3f6e">循环终止：模型输出 Final Answer，或撞上限</text>
</svg>