<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470">
  <text x="360" y="30" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#4a3f6e">规划四模式：怎么安排先后</text>

  <!-- ReAct -->
  <g>
    <rect x="30" y="60" width="315" height="180" rx="12" fill="#ffffff" stroke="#6b5b95" stroke-width="1.5"/>
    <text x="187" y="86" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#4a3f6e">ReAct 边想边做</text>
    <g font-family="Menlo,monospace" font-size="10" fill="#36304a">
      <circle cx="70" cy="120" r="10" fill="#6b5b95"/><text x="70" y="124" text-anchor="middle" fill="#fff" font-size="9">想</text>
      <circle cx="120" cy="120" r="10" fill="#8b7ab8"/><text x="120" y="124" text-anchor="middle" fill="#fff" font-size="9">做</text>
      <circle cx="170" cy="120" r="10" fill="#6b5b95"/><text x="170" y="124" text-anchor="middle" fill="#fff" font-size="9">想</text>
      <circle cx="220" cy="120" r="10" fill="#8b7ab8"/><text x="220" y="124" text-anchor="middle" fill="#fff" font-size="9">做</text>
      <circle cx="270" cy="120" r="10" fill="#6b5b95"/><text x="270" y="124" text-anchor="middle" fill="#fff" font-size="9">想</text>
      <line x1="80" y1="120" x2="110" y2="120" stroke="#b8aed4" stroke-width="1.5"/>
      <line x1="130" y1="120" x2="160" y2="120" stroke="#b8aed4" stroke-width="1.5"/>
      <line x1="180" y1="120" x2="210" y2="120" stroke="#b8aed4" stroke-width="1.5"/>
      <line x1="230" y1="120" x2="260" y2="120" stroke="#b8aed4" stroke-width="1.5"/>
    </g>
    <text x="187" y="160" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10.5" fill="#36304a">灵活容错，但短视</text>
    <text x="187" y="180" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10.5" fill="#36304a">适合：步骤少、路径不固定</text>
    <rect x="60" y="195" width="255" height="28" rx="14" fill="#ece7f5"/>
    <text x="187" y="213" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10.5" fill="#4a3f6e" font-weight="600">默认选择</text>
  </g>

  <!-- Plan-and-Execute -->
  <g>
    <rect x="375" y="60" width="315" height="180" rx="12" fill="#ffffff" stroke="#6b5b95" stroke-width="1.5"/>
    <text x="532" y="86" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#4a3f6e">Plan-and-Execute 先谋后动</text>
    <g font-family="Menlo,monospace" font-size="10" fill="#36304a">
      <rect x="400" y="105" width="120" height="30" rx="6" fill="#4a3f6e"/>
      <text x="460" y="124" text-anchor="middle" fill="#fff" font-size="9.5">先出完整计划</text>
      <rect x="545" y="105" width="120" height="30" rx="6" fill="#6b5b95"/>
      <text x="605" y="124" text-anchor="middle" fill="#fff" font-size="9.5">再逐步执行</text>
      <line x1="520" y1="120" x2="545" y2="120" stroke="#b8aed4" stroke-width="1.5"/>
    </g>
    <text x="532" y="160" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10.5" fill="#36304a">全局观强，但计划赶不上变化</text>
    <text x="532" y="180" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10.5" fill="#36304a">适合：步骤多、结构清晰</text>
    <rect x="405" y="195" width="255" height="28" rx="14" fill="#ece7f5"/>
    <text x="532" y="213" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10.5" fill="#4a3f6e" font-weight="600">超过五步就用它</text>
  </g>

  <!-- Reflexion -->
  <g>
    <rect x="30" y="265" width="315" height="180" rx="12" fill="#ffffff" stroke="#8b7ab8" stroke-width="1.5"/>
    <text x="187" y="291" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#4a3f6e">Reflexion 做完复盘</text>
    <g font-family="Menlo,monospace" font-size="10" fill="#36304a">
      <circle cx="90" cy="325" r="10" fill="#6b5b95"/><text x="90" y="329" text-anchor="middle" fill="#fff" font-size="9">做</text>
      <circle cx="150" cy="325" r="10" fill="#8b7ab8"/><text x="150" y="329" text-anchor="middle" fill="#fff" font-size="9">评</text>
      <circle cx="210" cy="325" r="10" fill="#6b5b95"/><text x="210" y="329" text-anchor="middle" fill="#fff" font-size="9">改</text>
      <circle cx="270" cy="325" r="10" fill="#8b7ab8"/><text x="270" y="329" text-anchor="middle" fill="#fff" font-size="9">做</text>
      <line x1="100" y1="325" x2="140" y2="325" stroke="#b8aed4" stroke-width="1.5"/>
      <line x1="160" y1="325" x2="200" y2="325" stroke="#b8aed4" stroke-width="1.5"/>
      <line x1="220" y1="325" x2="260" y2="325" stroke="#b8aed4" stroke-width="1.5"/>
    </g>
    <text x="187" y="365" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10.5" fill="#36304a">自我批评提升质量</text>
    <text x="187" y="385" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10.5" fill="#36304a">适合：代码生成</text>
    <rect x="60" y="400" width="255" height="28" rx="14" fill="#ece7f5"/>
    <text x="187" y="418" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10.5" fill="#a8625e" font-weight="600">代价：Token 接近翻倍</text>
  </g>

  <!-- ToT -->
  <g>
    <rect x="375" y="265" width="315" height="180" rx="12" fill="#ffffff" stroke="#8b7ab8" stroke-width="1.5"/>
    <text x="532" y="291" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#4a3f6e">Tree of Thoughts 多想几条路</text>
    <g font-family="Menlo,monospace" font-size="10" fill="#36304a">
      <circle cx="460" cy="312" r="8" fill="#4a3f6e"/>
      <circle cx="430" cy="338" r="8" fill="#6b5b95"/>
      <circle cx="490" cy="338" r="8" fill="#6b5b95"/>
      <circle cx="550" cy="338" r="8" fill="#6b5b95"/>
      <circle cx="620" cy="338" r="8" fill="#6b5b95"/>
      <circle cx="490" cy="364" r="8" fill="#8b7ab8"/>
      <circle cx="620" cy="364" r="8" fill="#b8aed4"/>
      <line x1="460" y1="312" x2="430" y2="338" stroke="#b8aed4" stroke-width="1.2"/>
      <line x1="460" y1="312" x2="490" y2="338" stroke="#b8aed4" stroke-width="1.2"/>
      <line x1="460" y1="312" x2="550" y2="338" stroke="#b8aed4" stroke-width="1.2"/>
      <line x1="460" y1="312" x2="620" y2="338" stroke="#b8aed4" stroke-width="1.2"/>
      <line x1="490" y1="338" x2="490" y2="364" stroke="#b8aed4" stroke-width="1.2"/>
      <line x1="620" y1="338" x2="620" y2="364" stroke="#b8aed4" stroke-width="1.2"/>
    </g>
    <text x="532" y="385" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10.5" fill="#36304a">适合：数学、逻辑难题</text>
    <rect x="405" y="400" width="255" height="28" rx="14" fill="#ece7f5"/>
    <text x="532" y="418" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10.5" fill="#a8625e" font-weight="600">Token 消耗是单线的几倍到十几倍</text>
  </g>
</svg>