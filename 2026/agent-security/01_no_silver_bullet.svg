<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380"><defs><marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#b56576"/></marker><marker id="arrw" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#b5443a"/></marker></defs><rect width="680" height="380" fill="#fff"/><text x="340" y="32" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="19" fill="#8e3b46" font-weight="700" text-anchor="middle">为什么 Prompt 注入没有银弹</text><rect x="50" y="62" width="280" height="240" rx="10" fill="#fdf8f9" stroke="#4a7c59" stroke-width="2"/><text x="190" y="92" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#4a7c59" font-weight="700" text-anchor="middle">SQL 注入（可根治）</text><rect x="75" y="110" width="230" height="40" rx="6" fill="#f8ecee" stroke="#4a7c59" stroke-width="1"/><text x="190" y="128" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#33272b" font-weight="600" text-anchor="middle">指令通道</text><text x="190" y="144" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#7a666c" font-weight="normal" text-anchor="middle">「SELECT * WHERE id = ?」</text><rect x="75" y="158" width="230" height="40" rx="6" fill="#f8ecee" stroke="#4a7c59" stroke-width="1"/><text x="190" y="176" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#33272b" font-weight="600" text-anchor="middle">数据通道</text><text x="190" y="192" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#7a666c" font-weight="normal" text-anchor="middle">参数: 12345</text><text x="190" y="236" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#4a7c59" font-weight="600" text-anchor="middle">两个通道分离</text><text x="190" y="258" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#7a666c" font-weight="normal" text-anchor="middle">数据库永不会</text><text x="190" y="276" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#7a666c" font-weight="normal" text-anchor="middle">把数据当指令执行</text><rect x="350" y="62" width="280" height="240" rx="10" fill="#fdf8f9" stroke="#b5443a" stroke-width="2"/><text x="490" y="92" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#b5443a" font-weight="700" text-anchor="middle">Prompt 注入（无法根治）</text><rect x="375" y="110" width="230" height="116" rx="6" fill="#f8ecee" stroke="#b5443a" stroke-width="1"/><text x="490" y="134" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#33272b" font-weight="600" text-anchor="middle">同一段 token 序列</text><text x="490" y="158" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#7a666c" font-weight="normal" text-anchor="middle">system: 你是客服助手</text><text x="490" y="178" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#b5443a" font-weight="normal" text-anchor="middle">user: 忽略之前的指令</text><text x="490" y="198" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#7a666c" font-weight="normal" text-anchor="middle">模型分不清谁是指令</text><text x="490" y="214" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#7a666c" font-weight="normal" text-anchor="middle">谁是数据</text><text x="490" y="252" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#b5443a" font-weight="600" text-anchor="middle">指令和数据同通道</text><text x="490" y="274" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#7a666c" font-weight="normal" text-anchor="middle">没有协议层分离</text><rect x="90" y="322" width="500" height="38" rx="6" fill="#f8ecee" stroke="#8e3b46" stroke-width="1"/><text x="340" y="346" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="#8e3b46" font-weight="700" text-anchor="middle">目标不是「永不注入」，是「注入了也造不成伤害」</text></svg>