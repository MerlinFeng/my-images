<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400"><defs><marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#b56576"/></marker><marker id="arrw" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#b5443a"/></marker></defs><rect width="680" height="400" fill="#fff"/><text x="340" y="32" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#8e3b46" font-weight="700" text-anchor="middle">权限收窄：注入成功了也偷不走东西</text><rect x="50" y="62" width="280" height="150" rx="10" fill="#fdf8f9" stroke="#b5443a" stroke-width="2"/><text x="190" y="92" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#b5443a" font-weight="700" text-anchor="middle">权限过大的工具</text><text x="190" y="118" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#33272b" font-weight="normal" text-anchor="middle">send_email(to, subject, body)</text><text x="190" y="144" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#7a666c" font-weight="normal" text-anchor="middle">收件人随便填</text><text x="190" y="162" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#7a666c" font-weight="normal" text-anchor="middle">内容随便写</text><text x="190" y="186" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#b5443a" font-weight="normal" text-anchor="middle">注入者拿到控制权</text><text x="190" y="204" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#b5443a" font-weight="normal" text-anchor="middle">= 想发谁发谁</text><rect x="350" y="62" width="280" height="150" rx="10" fill="#fdf8f9" stroke="#4a7c59" stroke-width="2"/><text x="490" y="92" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#4a7c59" font-weight="700" text-anchor="middle">收窄到业务语义</text><text x="490" y="118" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#33272b" font-weight="normal" text-anchor="middle">reply_to_email(email_id, body)</text><text x="490" y="144" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#7a666c" font-weight="normal" text-anchor="middle">收件人 = 原始发件人</text><text x="490" y="162" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#7a666c" font-weight="normal" text-anchor="middle">写死，无法篡改</text><text x="490" y="186" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#4a7c59" font-weight="normal" text-anchor="middle">注入者拿到控制权</text><text x="490" y="204" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#4a7c59" font-weight="normal" text-anchor="middle">= 也只能回复原发件人</text><text x="340" y="246" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#8e3b46" font-weight="700" text-anchor="middle">三条权限设计原则</text><rect x="50" y="268" width="580" height="34" rx="6" fill="#fdf8f9" stroke="#8e3b46" stroke-width="1.2"/><text x="80" y="290" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#8e3b46" font-weight="700" text-anchor="start">最小权限</text><text x="200" y="290" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#33272b" font-weight="normal" text-anchor="start">工具只给刚好够用的能力，没有「自由发挥」的参数</text><rect x="50" y="308" width="580" height="34" rx="6" fill="#fdf8f9" stroke="#b56576" stroke-width="1.2"/><text x="80" y="330" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#b56576" font-weight="700" text-anchor="start">参数可见</text><text x="200" y="330" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#33272b" font-weight="normal" text-anchor="start">敏感操作确认时展示完整参数，注入在参数里做手脚会露馅</text><rect x="50" y="348" width="580" height="34" rx="6" fill="#fdf8f9" stroke="#4a2028" stroke-width="1.2"/><text x="80" y="370" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#4a2028" font-weight="700" text-anchor="start">出参脱敏</text><text x="200" y="370" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#33272b" font-weight="normal" text-anchor="start">工具返回进上下文前脱敏，手机号身份证邮箱打码</text></svg>