<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380"><defs><marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#e07a54"/></marker></defs><rect width="680" height="380" fill="#fff"/><text x="340" y="32" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#c2583a" font-weight="700" text-anchor="middle">一条消息在 Gateway 里的完整旅程</text><rect x="30" y="80" width="118" height="90" rx="8" fill="#fdf8f5" stroke="#7d6b60" stroke-width="1.8"/><text x="89" y="108" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#7d6b60" font-weight="700" text-anchor="middle">渠道适配器</text><text x="89" y="130" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="9" fill="#7d6b60" font-weight="normal" text-anchor="middle">各平台格式</text><text x="89" y="148" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="9" fill="#7d6b60" font-weight="normal" text-anchor="middle">归一化</text><line x1="148" y1="125" x2="160" y2="125" stroke="#e07a54" stroke-width="1.5" marker-end="url(#arr)"/><rect x="160" y="80" width="118" height="90" rx="8" fill="#fdf8f5" stroke="#c2583a" stroke-width="1.8"/><text x="219" y="108" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#c2583a" font-weight="700" text-anchor="middle">会话管理器</text><text x="219" y="130" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="9" fill="#7d6b60" font-weight="normal" text-anchor="middle">找到你的</text><text x="219" y="148" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="9" fill="#7d6b60" font-weight="normal" text-anchor="middle">上下文</text><line x1="278" y1="125" x2="290" y2="125" stroke="#e07a54" stroke-width="1.5" marker-end="url(#arr)"/><rect x="290" y="80" width="118" height="90" rx="8" fill="#fdf8f5" stroke="#c08a3a" stroke-width="1.8"/><text x="349" y="108" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#c08a3a" font-weight="700" text-anchor="middle">队列</text><text x="349" y="130" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="9" fill="#7d6b60" font-weight="normal" text-anchor="middle">并发请求</text><text x="349" y="148" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="9" fill="#7d6b60" font-weight="normal" text-anchor="middle">串行化</text><line x1="408" y1="125" x2="420" y2="125" stroke="#e07a54" stroke-width="1.5" marker-end="url(#arr)"/><rect x="420" y="80" width="118" height="90" rx="8" fill="#fdf8f5" stroke="#7a3220" stroke-width="1.8"/><text x="479" y="108" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#7a3220" font-weight="700" text-anchor="middle">Agent 循环</text><text x="479" y="130" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="9" fill="#7d6b60" font-weight="normal" text-anchor="middle">推理→调工具</text><text x="479" y="148" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="9" fill="#7d6b60" font-weight="normal" text-anchor="middle">→再推理</text><line x1="538" y1="125" x2="550" y2="125" stroke="#e07a54" stroke-width="1.5" marker-end="url(#arr)"/><rect x="550" y="80" width="118" height="90" rx="8" fill="#fdf8f5" stroke="#4a8c6f" stroke-width="1.8"/><text x="609" y="108" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#4a8c6f" font-weight="700" text-anchor="middle">原路返回</text><text x="609" y="130" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="9" fill="#7d6b60" font-weight="normal" text-anchor="middle">回复送回你</text><text x="609" y="148" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="9" fill="#7d6b60" font-weight="normal" text-anchor="middle">所在的软件</text><text x="340" y="214" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="#c2583a" font-weight="700" text-anchor="middle">为什么单进程反而是对的</text><rect x="90" y="236" width="500" height="34" rx="6" fill="#fdf8f5" stroke="#c2583a" stroke-width="1.2"/><text x="120" y="258" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#c2583a" font-weight="700" text-anchor="start">部署零依赖</text><text x="230" y="258" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#33261f" font-weight="normal" text-anchor="start">一个 Node 进程 + 一份配置文件</text><rect x="90" y="276" width="500" height="34" rx="6" fill="#fdf8f5" stroke="#e07a54" stroke-width="1.2"/><text x="120" y="298" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#e07a54" font-weight="700" text-anchor="start">升级就重启</text><text x="230" y="298" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#33261f" font-weight="normal" text-anchor="start">没有服务编排，没有滚动发布</text><rect x="90" y="316" width="500" height="34" rx="6" fill="#fdf8f5" stroke="#4a8c6f" stroke-width="1.2"/><text x="120" y="338" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#4a8c6f" font-weight="700" text-anchor="start">备份就打包</text><text x="230" y="338" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#33261f" font-weight="normal" text-anchor="start">整个目录拷走，连人带记忆搬家</text></svg>