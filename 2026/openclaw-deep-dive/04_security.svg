<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440"><defs><marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#e07a54"/></marker></defs><rect width="680" height="440" fill="#fff"/><text x="340" y="32" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#c2583a" font-weight="700" text-anchor="middle">官方都承认「曾是一团糟」，后来怎么补的</text><rect x="50" y="66" width="580" height="82" rx="8" fill="#fdf8f5" stroke="#c2583a" stroke-width="1.8"/><text x="85" y="92" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="#c2583a" font-weight="700" text-anchor="start">细粒度权限</text><text x="85" y="114" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#7d6b60" font-weight="normal" text-anchor="start">每个能力独立开关</text><text x="85" y="132" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#7d6b60" font-weight="normal" text-anchor="start">shell / 文件 / 浏览器</text><text x="600" y="108" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#33261f" font-weight="600" text-anchor="end">第八篇：最小权限</text><rect x="50" y="158" width="580" height="82" rx="8" fill="#fdf8f5" stroke="#e07a54" stroke-width="1.8"/><text x="85" y="184" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="#e07a54" font-weight="700" text-anchor="start">doctor 体检</text><text x="85" y="206" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#7d6b60" font-weight="normal" text-anchor="start">一键扫配置里的</text><text x="85" y="224" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#7d6b60" font-weight="normal" text-anchor="start">危险授权</text><text x="600" y="200" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#33261f" font-weight="600" text-anchor="end">主动自查</text><rect x="50" y="250" width="580" height="82" rx="8" fill="#fdf8f5" stroke="#c08a3a" stroke-width="1.8"/><text x="85" y="276" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="#c08a3a" font-weight="700" text-anchor="start">渠道白名单</text><text x="85" y="298" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#7d6b60" font-weight="normal" text-anchor="start">只有名单里的人能</text><text x="85" y="316" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#7d6b60" font-weight="normal" text-anchor="start">跟 Agent 说话</text><text x="600" y="292" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#33261f" font-weight="600" text-anchor="end">防陌生人注入</text><rect x="50" y="342" width="580" height="82" rx="8" fill="#fdf8f5" stroke="#7a3220" stroke-width="1.8"/><text x="85" y="368" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="#7a3220" font-weight="700" text-anchor="start">执行容器</text><text x="85" y="390" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#7d6b60" font-weight="normal" text-anchor="start">shell 操作限制在沙箱</text><text x="85" y="408" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#7d6b60" font-weight="normal" text-anchor="start">删桌面文件被拦下</text><text x="600" y="384" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#33261f" font-weight="600" text-anchor="end">第八篇：进程级隔离</text></svg>