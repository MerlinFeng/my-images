<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380"><defs><marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#3aa885"/></marker></defs><rect width="680" height="380" fill="#fff"/><text x="340" y="32" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#1a7a5e" font-weight="700" text-anchor="middle">多模态 RAG：图片也能进知识库</text><rect x="250" y="62" width="180" height="60" rx="10" fill="#e8f4ef" stroke="#1a7a5e" stroke-width="2"/><text x="340" y="88" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#1a7a5e" font-weight="700" text-anchor="middle">CLIP</text><text x="340" y="110" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#6b7f78" font-weight="normal" text-anchor="middle">图片和文本映射到同一向量空间</text><rect x="50" y="156" width="180" height="70" rx="8" fill="#f6faf8" stroke="#3aa885" stroke-width="1.5"/><text x="140" y="180" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#3aa885" font-weight="700" text-anchor="middle">用户发图</text><text x="140" y="200" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#6b7f78" font-weight="normal" text-anchor="middle">产品故障照片</text><line x1="230" y1="191" x2="250" y2="191" stroke="#3aa885" stroke-width="1.5" marker-end="url(#arr)"/><rect x="250" y="156" width="180" height="70" rx="8" fill="#f6faf8" stroke="#1a7a5e" stroke-width="1.5"/><text x="340" y="180" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#1a7a5e" font-weight="700" text-anchor="middle">向量检索</text><text x="340" y="200" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#6b7f78" font-weight="normal" text-anchor="middle">找最相似的故障案例</text><line x1="430" y1="191" x2="450" y2="191" stroke="#3aa885" stroke-width="1.5" marker-end="url(#arr)"/><rect x="450" y="156" width="180" height="70" rx="8" fill="#f6faf8" stroke="#4a8c6f" stroke-width="1.5"/><text x="540" y="180" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#4a8c6f" font-weight="700" text-anchor="middle">LLM 综合</text><text x="540" y="200" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#6b7f78" font-weight="normal" text-anchor="middle">给出维修建议</text><rect x="90" y="258" width="500" height="90" rx="8" fill="#e8f4ef" stroke="#b5443a" stroke-width="1.5"/><text x="340" y="284" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="#b5443a" font-weight="700" text-anchor="middle">当前局限</text><text x="340" y="308" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#253530" font-weight="normal" text-anchor="middle">图片 embedding 语义粒度粗</text><text x="340" y="328" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#253530" font-weight="normal" text-anchor="middle">搜「红色报错弹窗」能找到「红色」和「弹窗」</text><text x="340" y="346" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#b5443a" font-weight="normal" text-anchor="middle">但分不清「报错」和「成功提示」</text></svg>