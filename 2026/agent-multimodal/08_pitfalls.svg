<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380"><defs><marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#3aa885"/></marker></defs><rect width="680" height="380" fill="#fff"/><text x="340" y="32" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="19" fill="#1a7a5e" font-weight="700" text-anchor="middle">多模态的坑：比纯文本多一倍</text><rect x="40" y="66" width="290" height="112" rx="10" fill="#f6faf8" stroke="#b5443a" stroke-width="2"/><circle cx="70" cy="100" r="16" fill="#b5443a"/><text x="70" y="105" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="98" y="96" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#b5443a" font-weight="700" text-anchor="start">分辨率陷阱</text><text x="98" y="122" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#6b7f78" font-weight="normal" text-anchor="start">太大费 token，太小看不清</text><text x="98" y="142" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#6b7f78" font-weight="normal" text-anchor="start">1568px 是甜点</text><rect x="355" y="66" width="290" height="112" rx="10" fill="#f6faf8" stroke="#1a7a5e" stroke-width="2"/><circle cx="385" cy="100" r="16" fill="#1a7a5e"/><text x="385" y="105" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="413" y="96" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#1a7a5e" font-weight="700" text-anchor="start">OCR 幻觉</text><text x="413" y="122" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#6b7f78" font-weight="normal" text-anchor="start">手写体识别错、表格结构丢</text><text x="413" y="142" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#6b7f78" font-weight="normal" text-anchor="start">错误被下游当事实</text><rect x="40" y="201" width="290" height="112" rx="10" fill="#f6faf8" stroke="#3aa885" stroke-width="2"/><circle cx="70" cy="235" r="16" fill="#3aa885"/><text x="70" y="240" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="98" y="231" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#3aa885" font-weight="700" text-anchor="start">多图混淆</text><text x="98" y="257" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#6b7f78" font-weight="normal" text-anchor="start">模型分不清哪张图对应</text><text x="98" y="277" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#6b7f78" font-weight="normal" text-anchor="start">哪个问题，prompt 要标注</text><rect x="355" y="201" width="290" height="112" rx="10" fill="#f6faf8" stroke="#0f4a38" stroke-width="2"/><circle cx="385" cy="235" r="16" fill="#0f4a38"/><text x="385" y="240" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">4</text><text x="413" y="231" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#0f4a38" font-weight="700" text-anchor="start">成本失控</text><text x="413" y="257" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#6b7f78" font-weight="normal" text-anchor="start">一张图 = 几百字文本 5-10 倍</text><text x="413" y="277" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#6b7f78" font-weight="normal" text-anchor="start">混合路由不是可选项</text></svg>