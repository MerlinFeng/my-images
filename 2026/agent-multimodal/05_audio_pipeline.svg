<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360"><defs><marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#3aa885"/></marker></defs><rect width="680" height="360" fill="#fff"/><text x="340" y="32" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#1a7a5e" font-weight="700" text-anchor="middle">语音处理：先转文字，再谈理解</text><rect x="50" y="66" width="140" height="56" rx="8" fill="#f6faf8" stroke="#3aa885" stroke-width="1.8"/><text x="120" y="90" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#3aa885" font-weight="700" text-anchor="middle">语音输入</text><text x="120" y="108" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#6b7f78" font-weight="normal" text-anchor="middle">.wav / .mp3</text><line x1="190" y1="94" x2="230" y2="94" stroke="#3aa885" stroke-width="2" marker-end="url(#arr)"/><rect x="230" y="66" width="140" height="56" rx="8" fill="#f6faf8" stroke="#1a7a5e" stroke-width="1.8"/><text x="300" y="90" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#1a7a5e" font-weight="700" text-anchor="middle">ASR 转写</text><text x="300" y="108" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#6b7f78" font-weight="normal" text-anchor="middle">Whisper</text><line x1="370" y1="94" x2="410" y2="94" stroke="#3aa885" stroke-width="2" marker-end="url(#arr)"/><rect x="410" y="66" width="140" height="56" rx="8" fill="#f6faf8" stroke="#0f4a38" stroke-width="1.8"/><text x="480" y="90" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#0f4a38" font-weight="700" text-anchor="middle">LLM 处理</text><text x="480" y="108" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#6b7f78" font-weight="normal" text-anchor="middle">当文本处理</text><rect x="180" y="156" width="320" height="56" rx="8" fill="#e8f4ef" stroke="#b5443a" stroke-width="1.5"/><text x="340" y="180" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#b5443a" font-weight="700" text-anchor="middle">置信度检查</text><text x="340" y="200" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#6b7f78" font-weight="normal" text-anchor="middle">文本过短 / 不连贯 → 提示用户打字</text><line x1="300" y1="122" x2="300" y2="156" stroke="#b5443a" stroke-width="1.5" marker-end="url(#arr)"/><rect x="50" y="240" width="280" height="80" rx="8" fill="#f6faf8" stroke="#3aa885" stroke-width="1.5"/><text x="190" y="264" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#3aa885" font-weight="700" text-anchor="middle">实时语音（打电话式）</text><text x="190" y="286" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#6b7f78" font-weight="normal" text-anchor="middle">流式 ASR + 流式 TTS</text><text x="190" y="304" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#6b7f78" font-weight="normal" text-anchor="middle">延迟在 500ms 内 · 成本高</text><rect x="350" y="240" width="280" height="80" rx="8" fill="#f6faf8" stroke="#4a8c6f" stroke-width="1.5"/><text x="490" y="264" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#4a8c6f" font-weight="700" text-anchor="middle">异步语音（按住说话）</text><text x="490" y="286" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#6b7f78" font-weight="normal" text-anchor="middle">说完 → 转写 → 回复</text><text x="490" y="304" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#6b7f78" font-weight="normal" text-anchor="middle">技术简单 · 推荐默认</text></svg>