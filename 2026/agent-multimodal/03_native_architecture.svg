<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420"><defs><marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#3aa885"/></marker></defs><rect width="680" height="420" fill="#fff"/><text x="340" y="32" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="19" fill="#1a7a5e" font-weight="700" text-anchor="middle">原生多模态模型内部：三步走</text><rect x="40" y="66" width="180" height="100" rx="10" fill="#f6faf8" stroke="#1a7a5e" stroke-width="2"/><text x="130" y="92" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#1a7a5e" font-weight="700" text-anchor="middle">视觉编码器</text><text x="130" y="114" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#6b7f78" font-weight="normal" text-anchor="middle">Vision Encoder</text><text x="130" y="136" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#253530" font-weight="normal" text-anchor="middle">图片切 patch</text><text x="130" y="154" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#253530" font-weight="normal" text-anchor="middle">每块变向量</text><line x1="220" y1="116" x2="260" y2="116" stroke="#3aa885" stroke-width="2" marker-end="url(#arr)"/><rect x="260" y="66" width="180" height="100" rx="10" fill="#f6faf8" stroke="#3aa885" stroke-width="2"/><text x="350" y="92" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#3aa885" font-weight="700" text-anchor="middle">跨模态投影</text><text x="350" y="114" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#6b7f78" font-weight="normal" text-anchor="middle">Projection</text><text x="350" y="136" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#253530" font-weight="normal" text-anchor="middle">图片向量 ↔ 文本 token</text><text x="350" y="154" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#253530" font-weight="normal" text-anchor