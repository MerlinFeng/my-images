<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400"><defs><marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#3aa885"/></marker></defs><rect width="680" height="400" fill="#fff"/><text x="340" y="32" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#1a7a5e" font-weight="700" text-anchor="middle">视频理解：抽帧是唯一务实路线</text><rect x="40" y="66" width="120" height="50" rx="8" fill="#f6faf8" stroke="#6b7f78" stroke-width="1.5"/><text x="100" y="88" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#253530" font-weight="700" text-anchor="middle">视频输入</text><text x="100" y="106" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#6b7f78" font-weight="normal" text-anchor="middle">5 min / 9000帧</text><line x1="160" y1="91" x2="220" y2="91" stroke="#3aa885" stroke-width="2" marker-end="url(#arr)"/><rect x="220" y="46" width="160" height="40" rx="6" fill="#f6faf8" stroke="#1a7a5e" stroke-width="1.5"/><text x="300" y="70" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#1a7a5e" font-weight="700" text-anchor="middle">抽帧 (ffmpeg)</text><line x1="380" y1="66" x2="420" y2="66" stroke="#1a7a5e" stroke-width="1.5" marker-end="url(#arr)"/><rect x="420" y="46" width="120" height="40" rx="6" fill="#f6faf8" stroke="#1a7a5e" stroke-width="1.5"/><text x="480" y="70" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#1a7a5e" font-weight="700" text-anchor="middle">图像理解</text><rect x="220" y="116" width="160" height="40" rx="6" fill="#f6faf8" stroke="#3aa885" stroke-width="1.5"/><text x="300" y="140" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#3aa885" font-weight="700" text-anchor="middle">提取音频 (ffmpeg)</text><line x1="380" y1="136" x2="420" y2="136" stroke="#3aa885" stroke-width="1.5" marker-end="url(#arr)"/><rect x="420" y="116" width="120" height="40" rx="6" fill="#f6faf8" stroke="#3aa885" stroke-width="1.5"/><text x="480" y="140" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#3aa885" font-weight="700" text-anchor="middle">ASR 转写</text><line x1="540" y1="66" x2="580" y2="66" stroke="#0f4a38" stroke-width="1.5" marker-end="url(#arr)"/><line x1="540" y1="136" x2="580" y2="136" stroke="#0f4a38" stroke-width="1.5" marker-end="url(#arr)"/><rect x="580" y="81" width="80" height="40" rx="6" fill="#f6faf8" stroke="#0f4a38" stroke-width="1.8"/><text x="620" y="105" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#0f4a38" font-weight="700" text-anchor="middle">合并</text><text x="620" y="121" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="8" fill="#6b7f78" font-weight="normal" text-anchor="middle"></text><rect x="90" y="190" width="500" height="80" rx="8" fill="#e8f4ef" stroke="#b5443a" stroke-width="1.5"/><text x="340" y="216" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="#b5443a" font-weight="700" text-anchor="middle">5 分钟视频的成本</text><text x="340" y="240" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#253530" font-weight="normal" text-anchor="middle">60 帧 × 1000 token + 音频文本 ≈ 7-10 万 token</text><text x="340" y="260" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#6b7f78" font-weight="normal" text-anchor="middle">这就是视频理解「能用」但还不够「好用」的原因</text><text x="340" y="300" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="#1a7a5e" font-weight="700" text-anchor="middle">抽帧策略</text><rect x="90" y="316" width="240" height="56" rx="6" fill="#f6faf8" stroke="#1a7a5e" stroke-width="1.2"/><text x="210" y="340" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#1a7a5e" font-weight="700" text-anchor="middle">均匀抽帧</text><text x="210" y="360" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#6b7f78" font-weight="normal" text-anchor="middle">每 5 秒一帧，适合平稳内容</text><rect x="350" y="316" width="240" height="56" rx="6" fill="#f6faf8" stroke="#3aa885" stroke-width="1.2"/><text x="470" y="340" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#3aa885" font-weight="700" text-anchor="middle">场景切换检测</text><text x="470" y="360" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#6b7f78" font-weight="normal" text-anchor="middle">PySceneDetect，适合跳跃内容</text></svg>