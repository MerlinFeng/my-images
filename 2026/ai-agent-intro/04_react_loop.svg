<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340">
  <defs>
    <marker id="arrow4" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4a7c9b"/>
    </marker>
  </defs>

  <text x="360" y="30" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#3d6a8a">ReAct 循环：思考 → 行动 → 观察</text>

  <!-- Circular layout: 3 boxes in a cycle -->
  <!-- Top: 思考 -->
  <g>
    <rect x="280" y="60" width="160" height="60" rx="30" fill="#3d6a8a"/>
    <text x="360" y="88" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#ffffff" font-weight="700">思考 (Reasoning)</text>
    <text x="360" y="105" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" fill="#dbe7f0">LLM 推理下一步</text>
  </g>

  <!-- Bottom left: 行动 -->
  <g>
    <rect x="100" y="220" width="160" height="60" rx="30" fill="#4a7c9b"/>
    <text x="180" y="248" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#ffffff" font-weight="700">行动 (Acting)</text>
    <text x="180" y="265" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" fill="#dbe7f0">调用工具</text>
  </g>

  <!-- Bottom right: 观察 -->
  <g>
    <rect x="460" y="220" width="160" height="60" rx="30" fill="#5d8eab"/>
    <text x="540" y="248" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#ffffff" font-weight="700">观察 (Observe)</text>
    <text x="540" y="265" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" fill="#dbe7f0">获取结果</text>
  </g>

  <!-- Arrows: 思考 → 行动 -->
  <path d="M 320 120 Q 220 180 200 215" stroke="#4a7c9b" stroke-width="2" fill="none" marker-end="url(#arrow4)"/>

  <!-- Arrows: 行动 → 观察 -->
  <path d="M 265 250 L 455 250" stroke="#4a7c9b" stroke-width="2" fill="none" marker-end="url(#arrow4)"/>

  <!-- Arrows: 观察 → 思考 (curve back up) -->
  <path d="M 540 215 Q 540 170 400 130" stroke="#4a7c9b" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arrow4)"/>

  <text x="445" y="200" font-family="Inter,Arial,sans-serif" font-size="11" fill="#3d6a8a" font-style="italic">循环回去</text>

  <!-- Bottom: 循环标签 -->
  <rect x="240" y="310" width="240" height="22" rx="11" fill="#e8f0f8"/>
  <text x="360" y="325" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" fill="#3d6a8a" font-weight="600">一直到任务完成为止</text>
</svg>