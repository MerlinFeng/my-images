<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 620" width="720" height="620">
  <defs>
    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4a7c9b"/>
    </marker>
    <marker id="arrow3-curved" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#a86c5e"/>
    </marker>
  </defs>

  <text x="360" y="30" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#3d6a8a">Agent 核心架构：五件套</text>
  <text x="360" y="50" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" fill="#7a8ba0">感知 → 推理 → 记忆 → 工具 → 行动 → 观察 → 循环</text>

  <!-- Layer 1: 用户/环境 -->
  <g>
    <rect x="280" y="80" width="160" height="50" rx="10" fill="#dbe7f0" stroke="#4a7c9b" stroke-width="1.5"/>
    <text x="360" y="103" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#3d6a8a" font-weight="700">用户 / 环境</text>
    <text x="360" y="120" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" fill="#7a8ba0">触发任务来源</text>
  </g>

  <!-- Arrow -->
  <line x1="360" y1="130" x2="360" y2="148" stroke="#4a7c9b" stroke-width="1.5" marker-end="url(#arrow3)"/>

  <!-- Layer 2: 感知模块 -->
  <g>
    <rect x="240" y="155" width="240" height="60" rx="10" fill="#ffffff" stroke="#4a7c9b" stroke-width="1.5"/>
    <text x="360" y="180" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#3d6a8a" font-weight="700">① 感知模块</text>
    <text x="360" y="200" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" fill="#3a4150">接收输入：文字 / 图片 / 语音 / 文件</text>
  </g>

  <line x1="360" y1="215" x2="360" y2="233" stroke="#4a7c9b" stroke-width="1.5" marker-end="url(#arrow3)"/>

  <!-- Layer 3: 大脑 -->
  <g>
    <rect x="220" y="240" width="280" height="70" rx="10" fill="#e8f0f8" stroke="#3d6a8a" stroke-width="2"/>
    <text x="360" y="265" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#3d6a8a" font-weight="700">② 大脑 (LLM / Reasoning)</text>
    <text x="360" y="285" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" fill="#3a4150">理解意图 / 拆解任务 / 制定计划 / 推理决策</text>
    <text x="360" y="302" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" fill="#7a8ba0" font-style="italic">核心：只决定"做什么"，不能"动手"</text>
  </g>

  <!-- Arrows to Memory and Tools -->
  <line x1="360" y1="310" x2="180" y2="335" stroke="#4a7c9b" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <line x1="360" y1="310" x2="540" y2="335" stroke="#4a7c9b" stroke-width="1.5" marker-end="url(#arrow3)"/>

  <!-- Layer 4a: 记忆 -->
  <g>
    <rect x="60" y="340" width="240" height="80" rx="10" fill="#ffffff" stroke="#4a7c9b" stroke-width="1.5"/>
    <text x="180" y="365" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#3d6a8a" font-weight="700">③ 记忆 (Memory)</text>
    <text x="180" y="385" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" fill="#3a4150">短期：当前对话上下文</text>
    <text x="180" y="402" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" fill="#3a4150">长期：用户偏好 / 历史知识</text>
  </g>

  <!-- Layer 4b: 工具 -->
  <g>
    <rect x="420" y="340" width="240" height="80" rx="10" fill="#ffffff" stroke="#4a7c9b" stroke-width="1.5"/>
    <text x="540" y="365" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#3d6a8a" font-weight="700">④ 工具 (Tools)</text>
    <text x="540" y="385" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" fill="#3a4150">API 调用 / 数据库 / 文件</text>
    <text x="540" y="402" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" fill="#3a4150">搜索 / 邮件 / 代码执行</text>
  </g>

  <!-- Arrows from Memory and Tools to Action -->
  <line x1="180" y1="420" x2="180" y2="450" stroke="#4a7c9b" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <line x1="540" y1="420" x2="540" y2="450" stroke="#4a7c9b" stroke-width="1.5" marker-end="url(#arrow3)"/>

  <!-- Layer 5: 行动 -->
  <g>
    <rect x="220" y="455" width="280" height="50" rx="10" fill="#e8f0f8" stroke="#3d6a8a" stroke-width="2"/>
    <text x="360" y="478" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#3d6a8a" font-weight="700">⑤ 行动 (Action)</text>
    <text x="360" y="495" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" fill="#3a4150">执行工具调用，产出结果</text>
  </g>

  <!-- Loop arrow back to 大脑 -->
  <path d="M 500 480 Q 660 480 660 280 Q 660 250 510 270" stroke="#a86c5e" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrow3-curved)"/>
  <text x="690" y="380" font-family="Inter,Arial,sans-serif" font-size="10" fill="#a86c5e" font-style="italic" transform="rotate(90,690,380)">观察结果，反馈给大脑</text>

  <!-- Bottom callout -->
  <g>
    <rect x="60" y="525" width="600" height="70" rx="10" fill="#dbe7f0" stroke="none"/>
    <text x="360" y="548" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#3d6a8a" font-weight="700">核心循环：思考 → 行动 → 观察 → 再思考</text>
    <text x="360" y="568" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" fill="#3a4150">每一步都基于 LLM 的推理和工具的反馈，直到任务完成</text>
    <text x="360" y="585" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" fill="#3a4150">这就是 ReAct 模式（Reasoning + Acting）</text>
  </g>
</svg>