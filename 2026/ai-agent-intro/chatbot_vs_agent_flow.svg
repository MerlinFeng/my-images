<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4a7c9b"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#a86c5e"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="360" y="30" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#3d6a8a">Chatbot vs Agent：执行流程对比</text>

  <!-- Left side: Chatbot -->
  <rect x="20" y="60" width="320" height="400" rx="14" ry="14" fill="#fdf6f4" stroke="#a86c5e" stroke-width="1.5" opacity="0.5"/>
  <text x="180" y="85" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#a86c5e">传统 Chatbot</text>
  <text x="180" y="105" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" fill="#7a8ba0">静态流程，每步固定</text>

  <!-- Step boxes for Chatbot -->
  <g font-family="Inter,Arial,sans-serif" font-size="12" fill="#3a4150">
    <rect x="50" y="125" width="260" height="36" rx="8" fill="#ffffff" stroke="#a86c5e" stroke-width="1.2"/>
    <text x="180" y="148" text-anchor="middle">① 用户输入</text>

    <line x1="180" y1="161" x2="180" y2="173" stroke="#a86c5e" stroke-width="1.5" marker-end="url(#arrow-red)"/>

    <rect x="50" y="178" width="260" height="36" rx="8" fill="#ffffff" stroke="#a86c5e" stroke-width="1.2"/>
    <text x="180" y="201" text-anchor="middle">② 关键词匹配 → 命中预设意图</text>

    <line x1="180" y1="214" x2="180" y2="226" stroke="#a86c5e" stroke-width="1.5" marker-end="url(#arrow-red)"/>

    <rect x="50" y="231" width="260" height="36" rx="8" fill="#ffffff" stroke="#a86c5e" stroke-width="1.2"/>
    <text x="180" y="254" text-anchor="middle">③ 调 API → 拿数据 → 模板生成</text>

    <line x1="180" y1="267" x2="180" y2="279" stroke="#a86c5e" stroke-width="1.5" marker-end="url(#arrow-red)"/>

    <rect x="50" y="284" width="260" height="36" rx="8" fill="#fff8f5" stroke="#a86c5e" stroke-width="1.2" stroke-dasharray="3,2"/>
    <text x="180" y="307" text-anchor="middle" fill="#a86c5e">④ 用户手动判断 + 写邮件</text>

    <text x="180" y="350" text-anchor="middle" font-size="11" fill="#7a8ba0" font-style="italic">每一步都是预设的</text>
    <text x="180" y="370" text-anchor="middle" font-size="11" fill="#7a8ba0" font-style="italic">流程是死的 if-else</text>
    <text x="180" y="400" text-anchor="middle" font-size="13" fill="#a86c5e" font-weight="700">"执行预设流程"</text>
  </g>

  <!-- Right side: Agent -->
  <rect x="380" y="60" width="320" height="400" rx="14" ry="14" fill="#f0f4f8" stroke="#4a7c9b" stroke-width="1.5" opacity="0.5"/>
  <text x="540" y="85" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#3d6a8a">AI Agent</text>
  <text x="540" y="105" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" fill="#7a8ba0">动态推理，自主决策</text>

  <!-- Step boxes for Agent -->
  <g font-family="Inter,Arial,sans-serif" font-size="12" fill="#3a4150">
    <rect x="410" y="125" width="260" height="36" rx="8" fill="#ffffff" stroke="#4a7c9b" stroke-width="1.2"/>
    <text x="540" y="148" text-anchor="middle">① 用户输入目标</text>

    <line x1="540" y1="161" x2="540" y2="173" stroke="#4a7c9b" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="410" y="178" width="260" height="36" rx="8" fill="#e8f0f8" stroke="#4a7c9b" stroke-width="1.5"/>
    <text x="540" y="195" text-anchor="middle" font-weight="600" fill="#3d6a8a">② Agent 自己推理步骤</text>
    <text x="540" y="210" text-anchor="middle" font-size="10" fill="#7a8ba0">"需要查什么？发邮件给谁？"</text>

    <line x1="540" y1="219" x2="540" y2="231" stroke="#4a7c9b" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="410" y="236" width="260" height="48" rx="8" fill="#ffffff" stroke="#4a7c9b" stroke-width="1.2"/>
    <text x="540" y="253" text-anchor="middle">③ 调销售 API / 调通讯录 API</text>
    <text x="540" y="270" text-anchor="middle" font-size="10" fill="#7a8ba0">自主选择工具</text>

    <line x1="540" y1="284" x2="540" y2="296" stroke="#4a7c9b" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="410" y="301" width="260" height="48" rx="8" fill="#e8f0f8" stroke="#4a7c9b" stroke-width="1.5"/>
    <text x="540" y="318" text-anchor="middle" font-weight="600" fill="#3d6a8a">④ 写邮件 + 调邮件 API 发送</text>
    <text x="540" y="335" text-anchor="middle" font-size="10" fill="#7a8ba0">条件判断后自动触发</text>

    <text x="540" y="370" text-anchor="middle" font-size="11" fill="#7a8ba0" font-style="italic">每一步都是自己推出来的</text>
    <text x="540" y="390" text-anchor="middle" font-size="11" fill="#7a8ba0" font-style="italic">开放问题，灵活应对</text>
    <text x="540" y="420" text-anchor="middle" font-size="13" fill="#3d6a8a" font-weight="700">"解决开放问题"</text>
  </g>

  <!-- Divider -->
  <line x1="370" y1="120" x2="370" y2="450" stroke="#dbe7f0" stroke-width="1" stroke-dasharray="3,3"/>
</svg>