<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380">
  <defs>
    <marker id="arrow8" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4a7c9b"/>
    </marker>
  </defs>

  <text x="360" y="30" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#3d6a8a">分层 Agent：公司化管理</text>
  <text x="360" y="50" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" fill="#7a8ba0">顶层分配、中层协调、底层执行</text>

  <!-- Top layer: 顶层 Agent -->
  <g>
    <rect x="280" y="75" width="160" height="55" rx="10" fill="#3d6a8a"/>
    <text x="360" y="100" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#ffffff" font-weight="700">顶层 Agent</text>
    <text x="360" y="118" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" fill="#dbe7f0">只管分配和汇总</text>
  </g>

  <!-- Middle layer: 主管 Agents -->
  <g>
    <rect x="80" y="180" width="140" height="55" rx="10" fill="#4a7c9b"/>
    <text x="150" y="205" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#ffffff" font-weight="700">主管 Agent</text>
    <text x="150" y="223" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" fill="#dbe7f0">协调子 Agent</text>
  </g>

  <g>
    <rect x="290" y="180" width="140" height="55" rx="10" fill="#4a7c9b"/>
    <text x="360" y="205" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#ffffff" font-weight="700">主管 Agent</text>
    <text x="360" y="223" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" fill="#dbe7f0">协调子 Agent</text>
  </g>

  <g>
    <rect x="500" y="180" width="140" height="55" rx="10" fill="#4a7c9b"/>
    <text x="570" y="205" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#ffffff" font-weight="700">主管 Agent</text>
    <text x="570" y="223" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" fill="#dbe7f0">协调子 Agent</text>
  </g>

  <!-- Bottom layer: 子 Agents -->
  <g>
    <rect x="20" y="295" width="100" height="45" rx="8" fill="#ffffff" stroke="#4a7c9b" stroke-width="1.5"/>
    <text x="70" y="318" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" fill="#3d6a8a" font-weight="700">子 Agent</text>
    <text x="70" y="332" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="9" fill="#7a8ba0">执行任务</text>
  </g>

  <g>
    <rect x="135" y="295" width="100" height="45" rx="8" fill="#ffffff" stroke="#4a7c9b" stroke-width="1.5"/>
    <text x="185" y="318" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" fill="#3d6a8a" font-weight="700">子 Agent</text>
    <text x="185" y="332" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="9" fill="#7a8ba0">执行任务</text>
  </g>

  <g>
    <rect x="260" y="295" width="100" height="45" rx="8" fill="#ffffff" stroke="#4a7c9b" stroke-width="1.5"/>
    <text x="310" y="318" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" fill="#3d6a8a" font-weight="700">子 Agent</text>
    <text x="310" y="332" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="9" fill="#7a8ba0">执行任务</text>
  </g>

  <g>
    <rect x="375" y="295" width="100" height="45" rx="8" fill="#ffffff" stroke="#4a7c9b" stroke-width="1.5"/>
    <text x="425" y="318" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" fill="#3d6a8a" font-weight="700">子 Agent</text>
    <text x="425" y="332" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="9" fill="#7a8ba0">执行任务</text>
  </g>

  <g>
    <rect x="490" y="295" width="100" height="45" rx="8" fill="#ffffff" stroke="#4a7c9b" stroke-width="1.5"/>
    <text x="540" y="318" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" fill="#3d6a8a" font-weight="700">子 Agent</text>
    <text x="540" y="332" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="9" fill="#7a8ba0">执行任务</text>
  </g>

  <g>
    <rect x="605" y="295" width="100" height="45" rx="8" fill="#ffffff" stroke="#4a7c9b" stroke-width="1.5"/>
    <text x="655" y="318" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" fill="#3d6a8a" font-weight="700">子 Agent</text>
    <text x="655" y="332" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="9" fill="#7a8ba0">执行任务</text>
  </g>

  <!-- Lines from top to middle -->
  <line x1="330" y1="130" x2="150" y2="180" stroke="#4a7c9b" stroke-width="1.5" marker-end="url(#arrow8)"/>
  <line x1="360" y1="130" x2="360" y2="180" stroke="#4a7c9b" stroke-width="1.5" marker-end="url(#arrow8)"/>
  <line x1="390" y1="130" x2="570" y2="180" stroke="#4a7c9b" stroke-width="1.5" marker-end="url(#arrow8)"/>

  <!-- Lines from middle to bottom -->
  <line x1="120" y1="235" x2="70" y2="295" stroke="#4a7c9b" stroke-width="1" marker-end="url(#arrow8)"/>
  <line x1="180" y1="235" x2="185" y2="295" stroke="#4a7c9b" stroke-width="1" marker-end="url(#arrow8)"/>

  <line x1="320" y1="235" x2="310" y2="295" stroke="#4a7c9b" stroke-width="1" marker-end="url(#arrow8)"/>
  <line x1="400" y1="235" x2="425" y2="295" stroke="#4a7c9b" stroke-width="1" marker-end="url(#arrow8)"/>

  <line x1="540" y1="235" x2="540" y2="295" stroke="#4a7c9b" stroke-width="1" marker-end="url(#arrow8)"/>
  <line x1="600" y1="235" x2="655" y2="295" stroke="#4a7c9b" stroke-width="1" marker-end="url(#arrow8)"/>

  <text x="360" y="365" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" fill="#3d6a8a" font-style="italic">适合：超大规模任务分解、企业级编排（目前偏实验）</text>
</svg>