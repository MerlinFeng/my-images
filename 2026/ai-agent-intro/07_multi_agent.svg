<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360">
  <defs>
    <marker id="arrow7" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4a7c9b"/>
    </marker>
  </defs>

  <text x="360" y="30" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#3d6a8a">多 Agent 协作：团队作战</text>
  <text x="360" y="50" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" fill="#7a8ba0">一个协调者 + 多个角色 Agent，互相配合</text>

  <!-- 用户 -->
  <g>
    <rect x="40" y="150" width="90" height="50" rx="10" fill="#dbe7f0" stroke="#4a7c9b" stroke-width="1.5"/>
    <text x="85" y="173" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#3d6a8a" font-weight="700">用户</text>
    <text x="85" y="190" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="9" fill="#7a8ba0">给目标</text>
  </g>

  <!-- Orchestrator -->
  <g>
    <rect x="280" y="80" width="160" height="60" rx="10" fill="#3d6a8a"/>
    <text x="360" y="108" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#ffffff" font-weight="700">协调者 Agent</text>
    <text x="360" y="126" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" fill="#dbe7f0">(Orchestrator)</text>
  </g>

  <!-- 3 worker agents -->
  <g>
    <rect x="120" y="240" width="140" height="60" rx="10" fill="#ffffff" stroke="#4a7c9b" stroke-width="1.5"/>
    <text x="190" y="268" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#3d6a8a" font-weight="700">Agent A</text>
    <text x="190" y="286" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" fill="#3a4150">角色 1</text>
  </g>

  <g>
    <rect x="290" y="240" width="140" height="60" rx="10" fill="#ffffff" stroke="#4a7c9b" stroke-width="1.5"/>
    <text x="360" y="268" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#3d6a8a" font-weight="700">Agent B</text>
    <text x="360" y="286" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" fill="#3a4150">角色 2</text>
  </g>

  <g>
    <rect x="460" y="240" width="140" height="60" rx="10" fill="#ffffff" stroke="#4a7c9b" stroke-width="1.5"/>
    <text x="530" y="268" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#3d6a8a" font-weight="700">Agent C</text>
    <text x="530" y="286" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" fill="#3a4150">角色 3</text>
  </g>

  <!-- 结果 -->
  <g>
    <rect x="600" y="150" width="90" height="50" rx="10" fill="#dbe7f0" stroke="#4a7c9b" stroke-width="1.5"/>
    <text x="645" y="173" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#3d6a8a" font-weight="700">整合结果</text>
    <text x="645" y="190" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="9" fill="#7a8ba0">聚合输出</text>
  </g>

  <!-- 用户 → 协调者 -->
  <line x1="130" y1="175" x2="280" y2="120" stroke="#4a7c9b" stroke-width="2" marker-end="url(#arrow7)"/>

  <!-- 协调者 → 结果 -->
  <line x1="440" y1="120" x2="600" y2="175" stroke="#4a7c9b" stroke-width="2" marker-end="url(#arrow7)"/>

  <!-- 协调者 → Workers -->
  <line x1="330" y1="140" x2="200" y2="240" stroke="#4a7c9b" stroke-width="1.5" marker-end="url(#arrow7)"/>
  <line x1="360" y1="140" x2="360" y2="240" stroke="#4a7c9b" stroke-width="1.5" marker-end="url(#arrow7)"/>
  <line x1="390" y1="140" x2="520" y2="240" stroke="#4a7c9b" stroke-width="1.5" marker-end="url(#arrow7)"/>

  <!-- Workers → 结果 -->
  <line x1="260" y1="270" x2="600" y2="195" stroke="#4a7c9b" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="430" y1="270" x2="600" y2="195" stroke="#4a7c9b" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="530" y1="265" x2="600" y2="195" stroke="#4a7c9b" stroke-width="1" stroke-dasharray="3,2"/>

  <text x="360" y="335" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" fill="#3d6a8a" font-style="italic">适合：复杂软件开发、多维度内容创作、需要多视角的任务</text>
</svg>