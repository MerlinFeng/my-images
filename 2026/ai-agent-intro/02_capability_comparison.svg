<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280">
  <text x="360" y="30" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#3d6a8a">五项核心能力对比</text>

  <!-- Header row -->
  <rect x="20" y="50" width="680" height="40" rx="8" fill="#3d6a8a"/>
  <g font-family="Inter,Arial,sans-serif" font-size="13" fill="#ffffff" font-weight="600">
    <text x="160" y="75" text-anchor="middle">能力维度</text>
    <text x="380" y="75" text-anchor="middle">传统 Chatbot</text>
    <text x="600" y="75" text-anchor="middle">AI Agent</text>
  </g>

  <!-- Data rows -->
  <g font-family="Inter,Arial,sans-serif" font-size="12" fill="#3a4150">
    <!-- Row 1 -->
    <rect x="20" y="90" width="680" height="32" rx="6" fill="#ffffff" stroke="#e0e6ed" stroke-width="0.8"/>
    <text x="160" y="110" text-anchor="middle" font-weight="600" fill="#3d6a8a">任务理解</text>
    <text x="380" y="110" text-anchor="middle">匹配预设意图</text>
    <text x="600" y="110" text-anchor="middle" font-weight="600" fill="#3d6a8a">自己推理目标</text>

    <!-- Row 2 -->
    <rect x="20" y="122" width="680" height="32" rx="6" fill="#f0f4f8" stroke="#e0e6ed" stroke-width="0.8"/>
    <text x="160" y="142" text-anchor="middle" font-weight="600" fill="#3d6a8a">流程控制</text>
    <text x="380" y="142" text-anchor="middle">固定的 if-else 链路</text>
    <text x="600" y="142" text-anchor="middle" font-weight="600" fill="#3d6a8a">动态规划步骤</text>

    <!-- Row 3 -->
    <rect x="20" y="154" width="680" height="32" rx="6" fill="#ffffff" stroke="#e0e6ed" stroke-width="0.8"/>
    <text x="160" y="174" text-anchor="middle" font-weight="600" fill="#3d6a8a">工具使用</text>
    <text x="380" y="174" text-anchor="middle">预设调用哪些 API</text>
    <text x="600" y="174" text-anchor="middle" font-weight="600" fill="#3d6a8a">自己选用什么工具</text>

    <!-- Row 4 -->
    <rect x="20" y="186" width="680" height="32" rx="6" fill="#f0f4f8" stroke="#e0e6ed" stroke-width="0.8"/>
    <text x="160" y="206" text-anchor="middle" font-weight="600" fill="#3d6a8a">异常处理</text>
    <text x="380" y="206" text-anchor="middle">超出预设就卡住</text>
    <text x="600" y="206" text-anchor="middle" font-weight="600" fill="#3d6a8a">自我纠错，换种方式重试</text>

    <!-- Row 5 -->
    <rect x="20" y="218" width="680" height="32" rx="6" fill="#ffffff" stroke="#e0e6ed" stroke-width="0.8"/>
    <text x="160" y="238" text-anchor="middle" font-weight="600" fill="#3d6a8a">多步骤协同</text>
    <text x="380" y="238" text-anchor="middle">基本做不到</text>
    <text x="600" y="238" text-anchor="middle" font-weight="600" fill="#3d6a8a">天生支持</text>
  </g>
</svg>