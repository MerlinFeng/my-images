<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460"><defs><marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#7c6cd4"/></marker><marker id="arrw" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#e08a3c"/></marker></defs><rect width="680" height="460" fill="#fff"/><text x="340" y="32" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" fill="#4c3f91" font-weight="700" text-anchor="middle">三种 Multi-Agent 协作拓扑</text><text x="60" y="78" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#4c3f91" font-weight="700" text-anchor="start">① 流水线 Pipeline</text><text x="60" y="98" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#6b6785" font-weight="normal" text-anchor="start">线性传递，步骤固定</text><rect x="90" y="112" width="80" height="46" rx="8" fill="#faf9fe" stroke="#7c6cd4" stroke-width="1.5"/><text x="130" y="140" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="#4c3f91" font-weight="600" text-anchor="middle">Agent A</text><line x1="170" y1="135" x2="198" y2="135" stroke="#7c6cd4" stroke-width="2" marker-end="url(#arr)"/><rect x="220" y="112" width="80" height="46" rx="8" fill="#faf9fe" stroke="#7c6cd4" stroke-width="1.5"/><text x="260" y="140" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="#4c3f91" font-weight="600" text-anchor="middle">Agent B</text><line x1="300" y1="135" x2="328" y2="135" stroke="#7c6cd4" stroke-width="2" marker-end="url(#arr)"/><rect x="350" y="112" width="80" height="46" rx="8" fill="#faf9fe" stroke="#7c6cd4" stroke-width="1.5"/><text x="390" y="140" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="#4c3f91" font-weight="600" text-anchor="middle">Agent C</text><text x="550" y="135" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#e08a3c" font-weight="normal" text-anchor="start">上游错→全错</text><text x="60" y="200" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#4c3f91" font-weight="700" text-anchor="start">② 中心调度 Orchestrator（生产首选）</text><rect x="280" y="214" width="120" height="42" rx="8" fill="#efecfb" stroke="#4c3f91" stroke-width="2"/><text x="340" y="240" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="#4c3f91" font-weight="700" text-anchor="middle">主管 Agent</text><rect x="150" y="292" width="100" height="40" rx="8" fill="#faf9fe" stroke="#7c6cd4" stroke-width="1.5"/><text x="200" y="317" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#4c3f91" font-weight="600" text-anchor="middle">分析师</text><line x1="340" y1="256" x2="200" y2="290" stroke="#7c6cd4" stroke-width="1.5" marker-end="url(#arr)"/><rect x="280" y="292" width="100" height="40" rx="8" fill="#faf9fe" stroke="#7c6cd4" stroke-width="1.5"/><text x="330" y="317" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#4c3f91" font-weight="600" text-anchor="middle">拆解师</text><line x1="340" y1="256" x2="330" y2="290" stroke="#7c6cd4" stroke-width="1.5" marker-end="url(#arr)"/><rect x="410" y="292" width="100" height="40" rx="8" fill="#faf9fe" stroke="#7c6cd4" stroke-width="1.5"/><text x="460" y="317" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#4c3f91" font-weight="600" text-anchor="middle">评审员</text><line x1="340" y1="256" x2="460" y2="290" stroke="#7c6cd4" stroke-width="1.5" marker-end="url(#arr)"/><text x="555" y="315" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#3f9c6b" font-weight="normal" text-anchor="start">可返工</text><text x="60" y="372" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#4c3f91" font-weight="700" text-anchor="start">③ 去中心化辩论 Debate</text><circle cx="150" cy="400" r="20" fill="#faf9fe" stroke="#7c6cd4" stroke-width="1.5"/><text x="150" y="404" font-family="Ping