<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380"><defs><marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#7c6cd4"/></marker><marker id="arrw" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#e08a3c"/></marker></defs><rect width="680" height="380" fill="#fff"/><text x="340" y="32" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" fill="#4c3f91" font-weight="700" text-anchor="middle">什么时候该上 Multi-Agent</text><rect x="40" y="62" width="290" height="260" rx="8" fill="#faf9fe" stroke="#3f9c6b" stroke-width="2"/><text x="185" y="90" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#3f9c6b" font-weight="700" text-anchor="middle">✅ 该拆的信号</text><text x="62" y="122" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#3f9c6b" font-weight="700" text-anchor="start">•</text><text x="78" y="122" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#2c2a3e" font-weight="normal" text-anchor="start">多个不同专业视角的子任务</text><text x="62" y="168" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#3f9c6b" font-weight="700" text-anchor="start">•</text><text x="78" y="168" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#2c2a3e" font-weight="normal" text-anchor="start">单 Agent 的 prompt 长到读不下去</text><text x="62" y="214" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#3f9c6b" font-weight="700" text-anchor="start">•</text><text x="78" y="214" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#2c2a3e" font-weight="normal" text-anchor="start">需要一个角色审查另一个</text><text x="62" y="260" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#3f9c6b" font-weight="700" text-anchor="start">•</text><text x="78" y="260" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#2c2a3e" font-weight="normal" text-anchor="start">子任务适合用不同模型/工具</text><rect x="350" y="62" width="290" height="260" rx="8" fill="#faf9fe" stroke="#e08a3c" stroke-width="2"/><text x="495" y="90" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#e08a3c" font-weight="700" text-anchor="middle">⛔ 别拆的信号</text><text x="372" y="122" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#e08a3c" font-weight="700" text-anchor="start">•</text><text x="388" y="122" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#2c2a3e" font-weight="normal" text-anchor="start">任务线性、单一视角</text><text x="372" y="168" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#e08a3c" font-weight="700" text-anchor="start">•</text><text x="388" y="168" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#2c2a3e" font-weight="normal" text-anchor="start">对延迟敏感（串行叠加）</text><text x="372" y="214" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#e08a3c" font-weight="700" text-anchor="start">•</text><text x="388" y="214" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#2c2a3e" font-weight="normal" text-anchor="start">预算紧张（多倍 token）</text><text x="372" y="260" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#e08a3c" font-weight="700" text-anchor="start">•</text><text x="388" y="260" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#2c2a3e" font-weight="normal" text-anchor="start">单 Agent 还没调好</text><rect x="120" y="336" width="440" height="32" rx="6" fill="#efecfb" stroke="#4c3f91" stroke-width="1"/><text x="340" y="357" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#4c3f91" font-weight="600" text-anchor="middle">先用单 Agent 跑到力不从心，再拆。别过早优化。</text></svg>