<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400"><defs><marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#7c6cd4"/></marker><marker id="arrw" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#e08a3c"/></marker></defs><rect width="680" height="400" fill="#fff"/><text x="340" y="34" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" fill="#4c3f91" font-weight="700" text-anchor="middle">单 Agent 为什么会「累」</text><rect x="45" y="70" width="250" height="270" rx="8" fill="#faf9fe" stroke="#e08a3c" stroke-width="2"/><text x="170" y="98" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#e08a3c" font-weight="700" text-anchor="middle">一个 Agent 全干</text><rect x="72" y="128" width="196" height="34" rx="6" fill="#fff" stroke="#e08a3c" stroke-width="1"/><text x="170" y="150" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="#2c2a3e" font-weight="500" text-anchor="middle">澄清需求</text><rect x="72" y="172" width="196" height="34" rx="6" fill="#fff" stroke="#e08a3c" stroke-width="1"/><text x="170" y="194" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="#2c2a3e" font-weight="500" text-anchor="middle">拆解功能</text><rect x="72" y="216" width="196" height="34" rx="6" fill="#fff" stroke="#e08a3c" stroke-width="1"/><text x="170" y="238" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="#2c2a3e" font-weight="500" text-anchor="middle">写验收标准</text><rect x="72" y="260" width="196" height="34" rx="6" fill="#fff" stroke="#e08a3c" stroke-width="1"/><text x="170" y="282" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="#2c2a3e" font-weight="500" text-anchor="middle">检查遗漏</text><text x="170" y="330" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#6b6785" font-weight="normal" text-anchor="middle">注意力被稀释，样样都糙</text><line x1="305" y1="205" x2="375" y2="205" stroke="#7c6cd4" stroke-width="2.5" marker-end="url(#arr)"/><text x="340" y="195" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="#7c6cd4" font-weight="700" text-anchor="middle">拆</text><rect x="385" y="70" width="250" height="270" rx="8" fill="#faf9fe" stroke="#3f9c6b" stroke-width="2"/><text x="510" y="98" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#3f9c6b" font-weight="700" text-anchor="middle">三个 Agent 分工</text><rect x="412" y="122" width="196" height="50" rx="6" fill="#fff" stroke="#3f9c6b" stroke-width="1"/><text x="510" y="143" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="#3f9c6b" font-weight="700" text-anchor="middle">分析师</text><text x="510" y="162" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#6b6785" font-weight="normal" text-anchor="middle">只管澄清需求</text><rect x="412" y="184" width="196" height="50" rx="6" fill="#fff" stroke="#3f9c6b" stroke-width="1"/><text x="510" y="205" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="#3f9c6b" font-weight="700" text-anchor="middle">拆解师</text><text x="510" y="224" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#6b6785" font-weight="normal" text-anchor="middle">只管拆功能</text><rect x="412" y="246" width="196" height="50" rx="6" fill="#fff" stroke="#3f9c6b" stroke-width="1"/><text x="510" y="267" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="#3f9c6b" font-weight="700" text-anchor="middle">评审员</text><text x="510" y="286" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#6b6785" font-weight="normal" text-anchor="middle">只管挑错</text></svg>