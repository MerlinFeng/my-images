<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440"><defs><marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#7c6cd4"/></marker><marker id="arrw" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#e08a3c"/></marker></defs><rect width="680" height="440" fill="#fff"/><text x="340" y="32" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="19" fill="#4c3f91" font-weight="700" text-anchor="middle">主管循环：带自我纠错的协作流程</text><rect x="180" y="62" width="320" height="44" rx="8" fill="#faf9fe" stroke="#6b6785" stroke-width="1.8"/><text x="340" y="89" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#6b6785" font-weight="600" text-anchor="middle"> 用户原始需求 </text><line x1="340" y1="106" x2="340" y2="122" stroke="#7c6cd4" stroke-width="2" marker-end="url(#arr)"/><rect x="180" y="124" width="320" height="44" rx="8" fill="#faf9fe" stroke="#7c6cd4" stroke-width="1.8"/><text x="340" y="151" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#7c6cd4" font-weight="600" text-anchor="middle">① 分析师澄清 → 需求要点</text><line x1="340" y1="168" x2="340" y2="184" stroke="#7c6cd4" stroke-width="2" marker-end="url(#arr)"/><rect x="180" y="186" width="320" height="44" rx="8" fill="#faf9fe" stroke="#4c3f91" stroke-width="1.8"/><text x="340" y="213" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#4c3f91" font-weight="600" text-anchor="middle">② 拆解师出方案 → 技术设计</text><line x1="340" y1="230" x2="340" y2="246" stroke="#7c6cd4" stroke-width="2" marker-end="url(#arr)"/><rect x="180" y="248" width="320" height="44" rx="8" fill="#faf9fe" stroke="#e08a3c" stroke-width="1.8"/><text x="340" y="275" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#e08a3c" font-weight="600" text-anchor="middle">③ 评审员挑刺 → 问题清单</text><polygon points="340,302 420,328 340,354 260,328" fill="#efecfb" stroke="#4c3f91" stroke-width="1.8"/><text x="340" y="332" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#4c3f91" font-weight="700" text-anchor="middle">有阻塞问题?</text><line x1="340" y1="294" x2="340" y2="302" stroke="#7c6cd4" stroke-width="2" marker-end="url(#arr)"/><line x1="420" y1="328" x2="560" y2="328" stroke="#3f9c6b" stroke-width="2" marker-end="url(#arr)"/><rect x="500" y="306" width="140" height="44" rx="8" fill="#faf9fe" stroke="#3f9c6b" stroke-width="1.8"/><text x="570" y="332" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="#3f9c6b" font-weight="700" text-anchor="middle">✅ 评审通过</text><text x="468" y="320" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#3f9c6b" font-weight="normal" text-anchor="start">No</text><path d="M 260 328 L 120 328 L 120 146 L 176 146" stroke="#e08a3c" stroke-width="1.8" fill="none" stroke-dasharray="6,4" marker-end="url(#arrw)"/><text x="130" y="320" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#e08a3c" font-weight="normal" text-anchor="start">Yes 带评审意见返工</text><rect x="150" y="400" width="380" height="34" rx="6" fill="#efecfb" stroke="#4c3f91" stroke-width="1"/><text x="340" y="422" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#4c3f91" font-weight="600" text-anchor="middle">⚠ max_rounds=2 保险丝：防止无限返工</text></svg>