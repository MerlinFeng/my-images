<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360"><defs><marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#7c6cd4"/></marker><marker id="arrw" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#e08a3c"/></marker></defs><rect width="680" height="360" fill="#fff"/><text x="340" y="32" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" fill="#4c3f91" font-weight="700" text-anchor="middle">协作中最容易踩的四个坑</text><rect x="40" y="66" width="290" height="112" rx="10" fill="#faf9fe" stroke="#7c6cd4" stroke-width="2"/><circle cx="70" cy="100" r="16" fill="#7c6cd4"/><text x="70" y="105" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="98" y="96" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#7c6cd4" font-weight="700" text-anchor="start">信息失真</text><text x="98" y="122" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#6b6785" font-weight="normal" text-anchor="start">长输出下游只抓开头</text><text x="98" y="152" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#2c2a3e" font-weight="600" text-anchor="start">→ 结构化输出（字段/编号）</text><rect x="355" y="66" width="290" height="112" rx="10" fill="#faf9fe" stroke="#e08a3c" stroke-width="2"/><circle cx="385" cy="100" r="16" fill="#e08a3c"/><text x="385" y="105" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="413" y="96" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#e08a3c" font-weight="700" text-anchor="start">幻觉传染</text><text x="413" y="122" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#6b6785" font-weight="normal" text-anchor="start">A 臆想，B、C 跟着编</text><text x="413" y="152" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#2c2a3e" font-weight="600" text-anchor="start">→ 独立评审员当刹车</text><rect x="40" y="201" width="290" height="112" rx="10" fill="#faf9fe" stroke="#4c3f91" stroke-width="2"/><circle cx="70" cy="235" r="16" fill="#4c3f91"/><text x="70" y="240" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="98" y="231" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#4c3f91" font-weight="700" text-anchor="start">无限返工</text><text x="98" y="257" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#6b6785" font-weight="normal" text-anchor="start">评审与拆解互相拉扯</text><text x="98" y="287" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#2c2a3e" font-weight="600" text-anchor="start">→ 设轮次上限 max_rounds</text><rect x="355" y="201" width="290" height="112" rx="10" fill="#faf9fe" stroke="#3f9c6b" stroke-width="2"/><circle cx="385" cy="235" r="16" fill="#3f9c6b"/><text x="385" y="240" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">4</text><text x="413" y="231" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#3f9c6b" font-weight="700" text-anchor="start">成本失控</text><text x="413" y="257" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#6b6785" font-weight="normal" text-anchor="start">一次跑要调 7-8 次 LLM</text><text x="413" y="287" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#2c2a3e" font-weight="600" text-anchor="start">→ 分级用模型，省一半</text></svg>