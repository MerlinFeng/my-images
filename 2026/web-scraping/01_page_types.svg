<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420"><defs><marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#3ba5ae"/></marker></defs><rect width="680" height="420" fill="#fff"/><text x="340" y="32" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="19" fill="#0e7c86" font-weight="700" text-anchor="middle">先判断目标页面是哪种</text><rect x="40" y="62" width="600" height="82" rx="8" fill="#f6fafb" stroke="#4a8c6f" stroke-width="1.8"/><text x="75" y="88" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="#4a8c6f" font-weight="700" text-anchor="start">纯静态</text><text x="75" y="110" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#5f767a" font-weight="normal" text-anchor="start">HTML 里有完整内容</text><text x="75" y="128" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#5f767a" font-weight="normal" text-anchor="start">查看源码可见正文</text><text x="620" y="102" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#4a8c6f" font-weight="600" text-anchor="end">requests 就够</text><rect x="40" y="158" width="600" height="82" rx="8" fill="#f6fafb" stroke="#b5443a" stroke-width="1.8"/><text x="75" y="184" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="#b5443a" font-weight="700" text-anchor="start">客户端渲染</text><text x="75" y="206" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#5f767a" font-weight="normal" text-anchor="start">HTML 只有空壳 + JS</text><text x="75" y="224" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#5f767a" font-weight="normal" text-anchor="start">源码看不到，F12 能看到</text><text x="620" y="198" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#b5443a" font-weight="600" text-anchor="end">需要 Playwright</text><rect x="40" y="254" width="600" height="82" rx="8" fill="#f6fafb" stroke="#c08a3a" stroke-width="1.8"/><text x="75" y="280" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="#c08a3a" font-weight="700" text-anchor="start">按需加载</text><text x="75" y="302" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#5f767a" font-weight="normal" text-anchor="start">基础内容静态，列表滚动加载</text><text x="75" y="320" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#5f767a" font-weight="normal" text-anchor="start">知乎/评论区/电商</text><text x="620" y="294" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#c08a3a" font-weight="600" text-anchor="end">Playwright + 滚动模拟</text><rect x="40" y="350" width="600" height="82" rx="8" fill="#f6fafb" stroke="#3ba5ae" stroke-width="1.8"/><text x="75" y="376" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="#3ba5ae" font-weight="700" text-anchor="start">混合型</text><text x="75" y="398" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#5f767a" font-weight="normal" text-anchor="start">一部分静态一部分动态</text><text x="75" y="416" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#5f767a" font-weight="normal" text-anchor="start">导航静态，问答 AJAX</text><text x="620" y="390" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#3ba5ae" font-weight="600" text-anchor="end">两者结合</text></svg>