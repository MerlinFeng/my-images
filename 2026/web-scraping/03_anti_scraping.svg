<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400"><defs><marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#3ba5ae"/></marker></defs><rect width="680" height="400" fill="#fff"/><text x="340" y="32" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="19" fill="#0e7c86" font-weight="700" text-anchor="middle">反爬：表现得像个正常用户</text><rect x="40" y="62" width="600" height="82" rx="8" fill="#f6fafb" stroke="#b5443a" stroke-width="1.8"/><text x="75" y="88" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="#b5443a" font-weight="700" text-anchor="start">IP 限流</text><text x="75" y="110" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#b5443a" font-weight="normal" text-anchor="start">同一 IP 请求太多 → 403</text><text x="620" y="92" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#4a8c6f" font-weight="600" text-anchor="end">请求间隔 2-5 秒</text><text x="620" y="112" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#4a8c6f" font-weight="600" text-anchor="end">代理 IP 池轮换</text><rect x="40" y="158" width="600" height="82" rx="8" fill="#f6fafb" stroke="#c08a3a" stroke-width="1.8"/><text x="75" y="184" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="#c08a3a" font-weight="700" text-anchor="start">UA 检测</text><text x="75" y="206" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#b5443a" font-weight="normal" text-anchor="start">python-requests → 一眼认出</text><text x="620" y="188" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#4a8c6f" font-weight="600" text-anchor="end">设正常浏览器 UA</text><text x="620" y="208" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#4a8c6f" font-weight="600" text-anchor="end">或直接用 Playwright</text><rect x="40" y="254" width="600" height="82" rx="8" fill="#f6fafb" stroke="#3ba5ae" stroke-width="1.8"/><text x="75" y="280" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="#3ba5ae" font-weight="700" text-anchor="start">行为指纹</text><text x="75" y="302" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#b5443a" font-weight="normal" text-anchor="start">检测鼠标轨迹、滚动行为</text><text x="620" y="284" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#4a8c6f" font-weight="600" text-anchor="end">Playwright 加随机延迟</text><text x="620" y="304" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#4a8c6f" font-weight="600" text-anchor="end">模拟滚动和停顿</text><rect x="40" y="350" width="600" height="82" rx="8" fill="#f6fafb" stroke="#084a51" stroke-width="1.8"/><text x="75" y="376" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="#084a51" font-weight="700" text-anchor="start">验证码</text><text x="75" y="398" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#b5443a" font-weight="normal" text-anchor="start">最头疼的反爬手段</text><text x="620" y="380" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#4a8c6f" font-weight="600" text-anchor="end">停抓 / 降频 / 申请 API</text><text x="620" y="400" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#4a8c6f" font-weight="600" text-anchor="end">别用打码平台</text></svg>