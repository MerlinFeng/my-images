<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400"><defs><marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2ecc71"/></marker></defs><rect width="680" height="400" fill="#fff"/><text x="340" y="30" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" fill="#1a6b3c" font-weight="700" text-anchor="middle">Tool vs Skill：判断标准</text><rect x="30" y="58" width="300" height="130" rx="8" fill="#f2f8f4" stroke="#2ecc71" stroke-width="1.5"/><text x="180" y="88" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#1a6b3c" font-weight="700" text-anchor="middle">Tool（原子能力）</text><text x="180" y="115" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="#5d7d64" font-weight="normal" text-anchor="middle">一个动作 = 完整</text><text x="180" y="138" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#5d7d64" font-weight="normal" text-anchor="middle">查天气 · 发邮件 · 算数学</text><text x="180" y="161" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#5d7d64" font-weight="normal" text-anchor="middle">输入输出明确，无多步依赖</text><text x="180" y="180" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#2ecc71" font-weight="600" text-anchor="middle">保持原子性，不嵌套</text><rect x="350" y="58" width="300" height="130" rx="8" fill="#1a6b3c" stroke="#1a6b3c" stroke-width="1.5"/><text x="500" y="88" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">Skill（工作流能力）</text><text x="500" y="115" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="#ffffff" font-weight="500" text-anchor="middle">多工具 + 有顺序 + 有分支</text><text x="500" y="138" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#e8f5ed" font-weight="normal" text-anchor="middle">3 个以上工具组合</text><text x="500" y="161" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#e8f5ed" font-weight="normal" text-anchor="middle">决策树 / 异常处理</text><text x="500" y="180" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#bfd9c8" font-weight="600" text-anchor="middle">Tool 的组合与编排</text><text x="340" y="115" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="28" fill="#1a6b3c" font-weight="700" text-anchor="middle">≠</text><rect x="60" y="215" width="560" height="75" rx="8" fill="#f2f8f4" stroke="#2ecc71" stroke-width="1.5"/><text x="340" y="248" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#1a6b3c" font-weight="700" text-anchor="middle">判断标准</text><text x="340" y="272" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="#5d7d64" font-weight="normal" text-anchor="middle">需要多步 + 有业务规则 → Skill  |  一个动作完整 → Tool</text><rect x="60" y="310" width="560" height="65" rx="8" fill="#e8f5ed" stroke="#1a6b3c" stroke-width="1.5"/><text x="340" y="338" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="#14522b" font-weight="600" text-anchor="middle">常见错误：把流程藏在巨型 Tool 里 → 无法复用 → 拆成 Tool + Skill</text></svg>