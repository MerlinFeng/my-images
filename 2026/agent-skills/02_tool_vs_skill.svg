<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400"><defs><marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#d4a63a"/></marker></defs><rect width="680" height="400" fill="#fff"/><text x="340" y="32" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="19" fill="#a87b1f" font-weight="700" text-anchor="middle">Tool 和 Skill 的分工</text><rect x="40" y="66" width="290" height="240" rx="10" fill="#fdfaf3" stroke="#d4a63a" stroke-width="2"/><text x="185" y="94" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#d4a63a" font-weight="700" text-anchor="middle">Tool（函数级）</text><text x="185" y="120" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#7d7057" font-weight="normal" text-anchor="middle">「能做什么」</text><rect x="70" y="146" width="230" height="32" rx="6" fill="#fff" stroke="#d4a63a" stroke-width="1"/><text x="185" y="167" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#33291a" font-weight="600" text-anchor="middle">查天气</text><rect x="70" y="186" width="230" height="32" rx="6" fill="#fff" stroke="#d4a63a" stroke-width="1"/><text x="185" y="207" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#33291a" font-weight="600" text-anchor="middle">发邮件</text><rect x="70" y="226" width="230" height="32" rx="6" fill="#fff" stroke="#d4a63a" stroke-width="1"/><text x="185" y="247" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#33291a" font-weight="600" text-anchor="middle">执行代码</text><rect x="70" y="266" width="230" height="32" rx="6" fill="#fff" stroke="#d4a63a" stroke-width="1"/><text x="185" y="287" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#33291a" font-weight="600" text-anchor="middle">查订单</text><rect x="350" y="66" width="290" height="240" rx="10" fill="#fdfaf3" stroke="#a87b1f" stroke-width="2"/><text x="495" y="94" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#a87b1f" font-weight="700" text-anchor="middle">Skill（工作流级）</text><text x="495" y="120" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#7d7057" font-weight="normal" text-anchor="middle">「该怎么做」</text><rect x="380" y="146" width="230" height="120" rx="6" fill="#fff" stroke="#a87b1f" stroke-width="1.5"/><text x="495" y="170" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#33291a" font-weight="600" text-anchor="middle">「每天结合天气路况日程</text><text x="495" y="190" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#33291a" font-weight="600" text-anchor="middle">提醒我几点出门」</text><text x="495" y="216" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#7d7057" font-weight="normal" text-anchor="middle">= 3 个工具 + 流程 + 规则</text><text x="495" y="236" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#7d7057" font-weight="normal" text-anchor="middle">打包成一个可插拔模块</text><rect x="90" y="330" width="500" height="50" rx="8" fill="#f8f0dd" stroke="#a87b1f" stroke-width="1.5"/><text x="340" y="352" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="#a87b1f" font-weight="700" text-anchor="middle">别把流程塞进巨型 Tool 里</text><text x="340" y="372" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#7d7057" font-weight="normal" text-anchor="middle">Tool 保持原子性，Skill 负责组合</text></svg>