<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400"><defs><marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#d4a63a"/></marker></defs><rect width="680" height="400" fill="#fff"/><text x="340" y="32" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="19" fill="#a87b1f" font-weight="700" text-anchor="middle">Harness 是舞台，Skill 是剧本</text><rect x="40" y="66" width="150" height="60" rx="8" fill="#fdfaf3" stroke="#7d7057" stroke-width="1.5"/><text x="115" y="90" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#33291a" font-weight="700" text-anchor="middle">用户输入</text><text x="115" y="110" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="9" fill="#7d7057" font-weight="normal" text-anchor="middle">「快递签收了但没收到」</text><line x1="190" y1="96" x2="230" y2="96" stroke="#d4a63a" stroke-width="2" marker-end="url(#arr)"/><rect x="230" y="66" width="150" height="60" rx="8" fill="#fdfaf3" stroke="#a87b1f" stroke-width="1.8"/><text x="305" y="90" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#a87b1f" font-weight="700" text-anchor="middle">① 检测</text><text x="305" y="110" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="9" fill="#7d7057" font-weight="normal" text-anchor="middle">匹配技能触发条件</text><line x1="380" y1="96" x2="420" y2="96" stroke="#d4a63a" stroke-width="2" marker-end="url(#arr)"/><rect x="420" y="66" width="150" height="60" rx="8" fill="#fdfaf3" stroke="#d4a63a" stroke-width="1.8"/><text x="495" y="90" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#d4a63a" font-weight="700" text-anchor="middle">② 注入</text><text x="495" y="110" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="9" fill="#7d7057" font-weight="normal" text-anchor="middle">流程/手册进上下文</text><line x1="570" y1="96" x2="610" y2="96" stroke="#d4a63a" stroke-width="2" marker-end="url(#arr)"/><rect x="610" y="66" width="60" height="60" rx="8" fill="#fdfaf3" stroke="#4a8c6f" stroke-width="1.8"/><text x="640" y="96" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#4a8c6f" font-weight="700" text-anchor="middle">③</text><text x="640" y="112" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="9" fill="#4a8c6f" font-weight="normal" text-anchor="middle">约束</text><text x="340" y="166" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#4a8c6f" font-weight="700" text-anchor="middle">③ 约束：只暴露当前 Skill 需要的工具</text><rect x="90" y="186" width="500" height="60" rx="8" fill="#fdfaf3" stroke="#b5443a" stroke-width="1.5"/><text x="340" y="210" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#33291a" font-weight="600" text-anchor="middle">「退款审批」技能：只能查订单 + 发退款</text><text x="340" y="230" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#7d7057" font-weight="normal" text-anchor="middle">看不到删除用户数据 —— 最小权限落地</text><rect x="90" y="270" width="500" height="100" rx="10" fill="#f8f0dd" stroke="#a87b1f" stroke-width="2"/><text x="340" y="300" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#a87b1f" font-weight="700" text-anchor="middle">Harness = 舞台</text><text x="340" y="324" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#7d7057" font-weight="normal" text-anchor="middle">循环控制、上下文装配、状态管理</text><text x="340" y="350" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#a87b1f" font-weight="600" text-anchor="middle">Skill = 剧本：没有舞台没法演，没有剧本不知道演什么</text></svg>