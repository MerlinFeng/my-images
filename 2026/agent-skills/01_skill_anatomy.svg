<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400"><defs><marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#d4a63a"/></marker></defs><rect width="680" height="400" fill="#fff"/><text x="340" y="32" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="19" fill="#a87b1f" font-weight="700" text-anchor="middle">一个 Skill 的四样东西</text><rect x="40" y="62" width="600" height="74" rx="8" fill="#fdfaf3" stroke="#a87b1f" stroke-width="1.8"/><text x="75" y="90" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#a87b1f" font-weight="700" text-anchor="start">触发条件</text><text x="75" y="112" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#7d7057" font-weight="normal" text-anchor="start">什么时候该用</text><text x="620" y="92" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#33291a" font-weight="600" text-anchor="end">「签收了但没收到」</text><text x="620" y="112" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#33291a" font-weight="600" text-anchor="end">才触发签收异议技能</text><rect x="40" y="150" width="600" height="74" rx="8" fill="#fdfaf3" stroke="#d4a63a" stroke-width="1.8"/><text x="75" y="178" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#d4a63a" font-weight="700" text-anchor="start">操作流程</text><text x="75" y="200" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#7d7057" font-weight="normal" text-anchor="start">先做什么再做什么</text><text x="620" y="180" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#33291a" font-weight="600" text-anchor="end">先查物流 → 再查订单</text><text x="620" y="200" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#33291a" font-weight="600" text-anchor="end">→ 按决策树处理</text><rect x="40" y="238" width="600" height="74" rx="8" fill="#fdfaf3" stroke="#c08a3a" stroke-width="1.8"/><text x="75" y="266" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#c08a3a" font-weight="700" text-anchor="start">工具组合</text><text x="75" y="288" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#7d7057" font-weight="normal" text-anchor="start">能用哪些工具</text><text x="620" y="268" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#33291a" font-weight="600" text-anchor="end">查物流 + 查订单 + 转人工</text><text x="620" y="288" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#33291a" font-weight="600" text-anchor="end">看不到删除用户数据</text><rect x="40" y="326" width="600" height="74" rx="8" fill="#fdfaf3" stroke="#6b4d0f" stroke-width="1.8"/><text x="75" y="354" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#6b4d0f" font-weight="700" text-anchor="start">领域知识</text><text x="75" y="376" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#7d7057" font-weight="normal" text-anchor="start">业务规则和术语</text><text x="620" y="356" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#33291a" font-weight="600" text-anchor="end">本人签收 vs 代收 vs 快递柜</text><text x="620" y="376" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#33291a" font-weight="600" text-anchor="end">分别怎么处理</text></svg>