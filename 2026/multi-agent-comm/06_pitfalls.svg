<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360"><defs><marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#12a3b4"/></marker><marker id="arrw" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#d97b29"/></marker></defs><rect width="680" height="360" fill="#fff"/><text x="340" y="32" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" fill="#0f5e68" font-weight="700" text-anchor="middle">通信层最容易翻车的四处</text><rect x="40" y="66" width="290" height="112" rx="10" fill="#f7fbfc" stroke="#12a3b4" stroke-width="2"/><circle cx="70" cy="100" r="16" fill="#12a3b4"/><text x="70" y="105" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="98" y="96" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#12a3b4" font-weight="700" text-anchor="start">消息膨胀</text><text x="98" y="122" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#5c7180" font-weight="normal" text-anchor="start">全量历史层层往下传</text><text x="98" y="152" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#1f2d33" font-weight="600" text-anchor="start">→ 传递前裁剪，只带需要的字段</text><rect x="355" y="66" width="290" height="112" rx="10" fill="#f7fbfc" stroke="#d97b29" stroke-width="2"/><circle cx="385" cy="100" r="16" fill="#d97b29"/><text x="385" y="105" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="413" y="96" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#d97b29" font-weight="700" text-anchor="start">上下文污染</text><text x="413" y="122" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#5c7180" font-weight="normal" text-anchor="start">挑刺人设串味到下游</text><text x="413" y="152" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#1f2d33" font-weight="600" text-anchor="start">→ 跨角色传递先清洗情绪措辞</text><rect x="40" y="201" width="290" height="112" rx="10" fill="#f7fbfc" stroke="#0f5e68" stroke-width="2"/><circle cx="70" cy="235" r="16" fill="#0f5e68"/><text x="70" y="240" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="98" y="231" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#0f5e68" font-weight="700" text-anchor="start">路由死循环</text><text x="98" y="257" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#5c7180" font-weight="normal" text-anchor="start">主管评审架构师原地打转</text><text x="98" y="287" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#1f2d33" font-weight="600" text-anchor="start">→ 轮次上限 + 三次无新信息强制收敛</text><rect x="355" y="201" width="290" height="112" rx="10" fill="#f7fbfc" stroke="#3f9c6b" stroke-width="2"/><circle cx="385" cy="235" r="16" fill="#3f9c6b"/><text x="385" y="240" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">4</text><text x="413" y="231" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#3f9c6b" font-weight="700" text-anchor="start">并行写冲突</text><text x="413" y="257" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#5c7180" font-weight="normal" text-anchor="start">并发节点互相覆盖状态</text><text x="413" y="287" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#1f2d33" font-weight="600" text-anchor="start">→ 每字段定义 reducer 合并语义</text></svg>