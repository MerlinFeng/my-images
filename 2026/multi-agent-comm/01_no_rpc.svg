<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380"><defs><marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#12a3b4"/></marker><marker id="arrw" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#d97b29"/></marker></defs><rect width="680" height="380" fill="#fff"/><text x="340" y="34" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="19" fill="#0f5e68" font-weight="700" text-anchor="middle">协作的物理真相：没有通信，只有上下文搬运</text><rect x="45" y="80" width="190" height="130" rx="10" fill="#f7fbfc" stroke="#0f5e68" stroke-width="2"/><text x="140" y="112" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#0f5e68" font-weight="700" text-anchor="middle">Agent A</text><text x="140" y="136" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#5c7180" font-weight="normal" text-anchor="middle">一次独立的</text><text x="140" y="156" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#5c7180" font-weight="normal" text-anchor="middle">LLM API 调用</text><text x="140" y="190" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#d97b29" font-weight="normal" text-anchor="middle">调用结束即「死」</text><rect x="445" y="80" width="190" height="130" rx="10" fill="#f7fbfc" stroke="#0f5e68" stroke-width="2"/><text x="540" y="112" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#0f5e68" font-weight="700" text-anchor="middle">Agent B</text><text x="540" y="136" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#5c7180" font-weight="normal" text-anchor="middle">另一次独立的</text><text x="540" y="156" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#5c7180" font-weight="normal" text-anchor="middle">LLM API 调用</text><text x="540" y="190" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#d97b29" font-weight="normal" text-anchor="middle">不知道 A 存在</text><line x1="238" y1="130" x2="442" y2="130" stroke="#d97b29" stroke-width="1.5" stroke-dasharray="6,4"/><text x="340" y="122" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#d97b29" font-weight="normal" text-anchor="middle">不存在这种直连</text><line x1="320" y1="118" x2="360" y2="144" stroke="#d97b29" stroke-width="2"/><line x1="360" y1="118" x2="320" y2="144" stroke="#d97b29" stroke-width="2"/><line x1="140" y1="210" x2="140" y2="258" stroke="#12a3b4" stroke-width="2" marker-end="url(#arr)"/><rect x="200" y="236" width="280" height="52" rx="8" fill="#e6f4f6" stroke="#12a3b4" stroke-width="2"/><text x="340" y="258" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#0f5e68" font-weight="700" text-anchor="middle">你的胶水代码</text><text x="340" y="278" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#5c7180" font-weight="normal" text-anchor="middle">拿 A 的输出 → 拼进 B 的 prompt</text><line x1="540" y1="258" x2="540" y2="212" stroke="#12a3b4" stroke-width="2" marker-end="url(#arr)"/><line x1="140" y1="262" x2="196" y2="262" stroke="#12a3b4" stroke-width="2" marker-end="url(#arr)"/><line x1="484" y1="262" x2="540" y2="262" stroke="#12a3b4" stroke-width="2" marker-end="url(#arr)"/><rect x="90" y="316" width="500" height="40" rx="8" fill="#f7fbfc" stroke="#3f9c6b" stroke-width="1.8"/><text x="340" y="341" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="#3f9c6b" font-weight="700" text-anchor="middle">搬运什么、怎么搬，直接决定协作质量</text></svg>