<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480"><defs><marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#12a3b4"/></marker><marker id="arrw" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#d97b29"/></marker></defs><rect width="680" height="480" fill="#fff"/><text x="340" y="32" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" fill="#0f5e68" font-weight="700" text-anchor="middle">四种通信机制：从拼字符串到真协议</text><rect x="40" y="62" width="290" height="128" rx="10" fill="#f7fbfc" stroke="#12a3b4" stroke-width="2"/><text x="185" y="92" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#12a3b4" font-weight="700" text-anchor="middle">① 文本直传</text><line x1="64" y1="106" x2="306" y2="106" stroke="#12a3b4" stroke-width="1" stroke-dasharray="3,3"/><text x="185" y="134" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#1f2d33" font-weight="normal" text-anchor="middle">上游输出拼进下游 prompt</text><text x="185" y="164" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#5c7180" font-weight="normal" text-anchor="middle">零成本，长输出易失真</text><rect x="355" y="62" width="290" height="128" rx="10" fill="#f7fbfc" stroke="#0f5e68" stroke-width="2"/><text x="500" y="92" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#0f5e68" font-weight="700" text-anchor="middle">② 结构化消息</text><line x1="379" y1="106" x2="621" y2="106" stroke="#0f5e68" stroke-width="1" stroke-dasharray="3,3"/><text x="500" y="134" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#1f2d33" font-weight="normal" text-anchor="middle">带信封：sender/receiver/type/content</text><text x="500" y="164" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#5c7180" font-weight="normal" text-anchor="middle">可路由、可回放追溯</text><rect x="40" y="212" width="290" height="128" rx="10" fill="#f7fbfc" stroke="#3f9c6b" stroke-width="2"/><text x="185" y="242" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#3f9c6b" font-weight="700" text-anchor="middle">③ 共享状态</text><line x1="64" y1="256" x2="306" y2="256" stroke="#3f9c6b" stroke-width="1" stroke-dasharray="3,3"/><text x="185" y="284" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#1f2d33" font-weight="normal" text-anchor="middle">大家改同一个 state，reducer 合并</text><text x="185" y="314" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#5c7180" font-weight="normal" text-anchor="middle">并行友好，要定义合并语义</text><rect x="355" y="212" width="290" height="128" rx="10" fill="#f7fbfc" stroke="#d97b29" stroke-width="2"/><text x="500" y="242" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#d97b29" font-weight="700" text-anchor="middle">④ 转交即工具调用</text><line x1="379" y1="256" x2="621" y2="256" stroke="#d97b29" stroke-width="1" stroke-dasharray="3,3"/><text x="500" y="284" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#1f2d33" font-weight="normal" text-anchor="middle">handoff = transfer_to_* 的 function call</text><text x="500" y="314" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#5c7180" font-weight="normal" text-anchor="middle">控制权转移，历史原地不动</text><rect x="40" y="372" width="600" height="78" rx="10" fill="#e6f4f6" stroke="#0f5e68" stroke-width="2"/><text x="340" y="400" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#0f5e68" font-weight="700" text-anchor="middle">⑤ A2A 网络协议：跨进程、跨组织才需要</text><text x="340" y="428" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#5c7180" font-weight="normal" text-anchor="middle">Agent Card 发现 + Task 状态机 + HTTP/JSON-RPC；同进程协作用它 = 杀鸡用牛刀</text></svg>