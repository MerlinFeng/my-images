<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360"><defs><marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#12a3b4"/></marker><marker id="arrw" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#d97b29"/></marker></defs><rect width="680" height="360" fill="#fff"/><text x="340" y="32" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" fill="#0f5e68" font-weight="700" text-anchor="middle">决定架构上限的两个硬约束</text><rect x="40" y="66" width="290" height="230" rx="10" fill="#f7fbfc" stroke="#0f5e68" stroke-width="2"/><text x="185" y="96" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#0f5e68" font-weight="700" text-anchor="middle">上下文窗口是物理瓶颈</text><rect x="70" y="126" width="60" height="22" rx="4" fill="#12a3b4" opacity="0.35"/><text x="140" y="142" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#5c7180" font-weight="normal" text-anchor="start">第1环 2K</text><rect x="70" y="160" width="100" height="22" rx="4" fill="#12a3b4" opacity="0.53"/><text x="180" y="176" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#5c7180" font-weight="normal" text-anchor="start">第2环 4K</text><rect x="70" y="194" width="140" height="22" rx="4" fill="#12a3b4" opacity="0.71"/><text x="220" y="210" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#5c7180" font-weight="normal" text-anchor="start">第3环 8K</text><rect x="70" y="228" width="180" height="22" rx="4" fill="#12a3b4" opacity="0.89"/><text x="260" y="244" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#5c7180" font-weight="normal" text-anchor="start">第4环 撞顶</text><text x="185" y="276" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#3f9c6b" font-weight="600" text-anchor="middle">对策：摘要节点压缩后再传</text><rect x="350" y="66" width="290" height="23