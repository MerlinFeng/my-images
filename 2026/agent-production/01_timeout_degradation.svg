amily="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#c0524a" font-weight="600" text-anchor="middle">超时</text><rect x="400" y="66" width="240" height="56" rx="8" fill="#f7f9fb" stroke="#c0524a" stroke-width="1.8"/><text x="520" y="90" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#c0524a" font-weight="700" text-anchor="middle">降级处理</text><text x="520" y="108" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#6b7280" font-weight="normal" text-anchor="middle">兜底文案 / 部分结果 / 建议</text><text x="340" y="246" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="#2b3a55" font-weight="700" text-anchor="middle">三种降级策略</text><rect x="90" y="268" width="500" height="34" rx="6" fill="#f7f9fb" stroke="#2b3a55" stroke-width="1.2"/><text x="120" y="290" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#2b3a55" font-weight="700" text-anchor="start">LLM 超时</text><text x="230" y="290" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#252a33" font-weight="normal" text-anchor="start">返回「我还在思考，请稍等」</text><rect x="90" y="308" width="500" height="34" rx="6" fill="#f7f9fb" stroke="#4a6fa5" stroke-width="1.2"/><text x="120" y="330" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#4a6fa5" font-weight="700" text-anchor="start">工具超时</text><text x="230" y="330" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#252a33" font-weight="normal" text-anchor="start">标记工具暂不可用，继续下一步</text><rect x="90" y="348" width="500" height="34" rx="6" fill="#f7f9fb" stroke="#c08a3a" stroke-width="1.2"/><text x="120" y="370" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#c08a3a" font-weight="700" text-anchor="start">循环超时</text><text x="230" y="370" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#252a33" font-weight="normal" text-anchor="start">返回当前已有的部分结果</text></svg>