<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460"><defs><marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#4a6fa5"/></marker></defs><rect width="520" height="460" fill="#fff"/><text x="260" y="32" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="19" fill="#2b3a55" font-weight="700" text-anchor="middle">上线前 Checklist</text><rect x="30" y="56" width="18" height="18" rx="3" fill="none" stroke="#4a6fa5" stroke-width="1.5"/><path d="M 33 65 L 37 69 L 44 60" stroke="#4a8c6f" stroke-width="2" fill="none"/><text x="56" y="69" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#252a33" font-weight="normal" text-anchor="start">LLM 和工具调用都有硬超时 + 降级文案</text><rect x="30" y="86" width="18" height="18" rx="3" fill="none" stroke="#4a6fa5" stroke-width="1.5"/><path d="M 33 95 L 37 99 L 44 90" stroke="#4a8c6f" stroke-width="2" fill="none"/><text x="56" y="99" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#252a33" font-weight="normal" text-anchor="start">ReAct 有 max_steps + 死循环检测</text><rect x="30" y="116" width="18" height="18" rx="3" fill="none" stroke="#4a6fa5" stroke-width="1.5"/><path d="M 33 125 L 37 129 L 44 120" stroke="#4a8c6f" stroke-width="2" fill="none"/><text x="56" y="129" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#252a33" font-weight="normal" text-anchor="start">会话状态每轮落库，重启可恢复</text><rect x="30" y="146" width="18" height="18" rx="3" fill="none" stroke="#4a6fa5" stroke-width="1.5"/><path d="M 33 155 L 37 159 L 44 150" stroke="#4a8c6f" stroke-width="2" fill="none"/><text x="56" y="159" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#252a33" font-weight="normal" text-anchor="start">长任务走异步队列，不阻塞 HTTP</text><rect x="30" y="176" width="18" height="18" rx="3" fill="none" stroke="#4a6fa5" stroke-width="1.5"/><path d="M 33 185 L 37 189 L 44 180" stroke="#4a8c6f" stroke-width="2" fill="none"/><text x="56" y="189" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#252a33" font-weight="normal" text-anchor="start">每次调用记录输入输出、耗时、token</text><rect x="30" y="206" width="18" height="18" rx="3" fill="none" stroke="#4a6fa5" stroke-width="1.5"/><path d="M 33 215 L 37 219 L 44 210" stroke="#4a8c6f" stroke-width="2" fill="none"/><text x="56" y="219" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#252a33" font-weight="normal" text-anchor="start">全链路追踪，能回放任意会话</text><rect x="30" y="236" width="18" height="18" rx="3" fill="none" stroke="#4a6fa5" stroke-width="1.5"/><path d="M 33 245 L 37 249 L 44 240" stroke="#4a8c6f" stroke-width="2" fill="none"/><text x="56" y="249" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#252a33" font-weight="normal" text-anchor="start">四类告警：调用次数、token、失败率、延迟</text><rect x="30" y="266" width="18" height="18" rx="3" fill="none" stroke="#4a6fa5" stroke-width="1.5"/><path d="M 33 275 L 37 279 L 44 270" stroke="#4a8c6f" stroke-width="2" fill="none"/><text x="56" y="279" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#252a33" font-weight="normal" text-anchor="start">模型分级，简单任务用小模型</text><rect x="30" y="296" width="18" height="18" rx="3" fill="none" stroke="#4a6fa5" stroke-width="1.5"/><path d="M 33 305 L 37 309 L 44 300" stroke="#4a8c6f" stroke-width="2" fill="none"/><text x="56" y="309" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#252a33" font-weight="normal" text-anchor="start">高频问题有缓存，相同 query 不重复调</text><rect x="30" y="326" width="18" height="18" rx="3" fill="none" stroke="#4a6fa5" stroke-width="1.5"/><path d="M 33 335 L 37 339 L 44 330" stroke="#4a8c6f" stroke-width="2" fill="none"/><text x="56" y="339" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#252a33" font-weight="normal" text-anchor="start">每用户/每会话有 token 预算上限</text><rect x="30" y="356" width="18" height="18" rx="3" fill="none" stroke="#4a6fa5" stroke-width="1.5"/><path d="M 33 365 L 37 369 L 44 360" stroke="#4a8c6f" stroke-width="2" fill="none"/><text x="56" y="369" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#252a33" font-weight="normal" text-anchor="start">新功能特性开关，可灰度可回滚</text><rect x="30" y="386" width="18" height="18" rx="3" fill="none" stroke="#4a6fa5" stroke-width="1.5"/><path d="M 33 395 L 37 399 L 44 390" stroke="#4a8c6f" stroke-width="2" fill="none"/><text x="56" y="399" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#252a33" font-weight="normal" text-anchor="start">请求排队 + 用户级限流</text><rect x="30" y="416" width="18" height="18" rx="3" fill="none" stroke="#4a6fa5" stroke-width="1.5"/><path d="M 33 425 L 37 429 L 44 420" stroke="#4a8c6f" stroke-width="2" fill="none"/><text x="56" y="429" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#252a33" font-weight="normal" text-anchor="start">API 重试指数退避，最多 3 次</text></svg>