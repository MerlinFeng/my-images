<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420"><defs><marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#8a8fd0"/></marker></defs><rect width="680" height="420" fill="#fff"/><text x="340" y="32" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="19" fill="#5b5ea6" font-weight="700" text-anchor="middle">Harness 的四大核心职责</text><rect x="40" y="62" width="600" height="84" rx="10" fill="#f8f8fc" stroke="#5b5ea6" stroke-width="2"/><text x="75" y="90" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#5b5ea6" font-weight="700" text-anchor="start">循环控制</text><text x="75" y="112" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#6b6b80" font-weight="normal" text-anchor="start">步数 + 时间 + token 预算</text><text x="75" y="130" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#6b6b80" font-weight="normal" text-anchor="start">三重保险丝同时生效</text><text x="620" y="96" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#2a2a35" font-weight="600" text-anchor="end">模型说「做完了」才停</text><text x="620" y="116" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#2a2a35" font-weight="600" text-anchor="end">卡住也要强制收尾</text><rect x="40" y="158" width="600" height="84" rx="10" fill="#f8f8fc" stroke="#8a8fd0" stroke-width="2"/><text x="75" y="186" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#8a8fd0" font-weight="700" text-anchor="start">上下文装配</text><text x="75" y="208" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#6b6b80" font-weight="normal" text-anchor="start">system prompt + 记忆注入</text><text x="75" y="226" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#6b6b80" font-weight="normal" text-anchor="start">+ 历史压缩 + 当前输入</text><text x="620" y="192" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#2a2a35" font-weight="600" text-anchor="end">模型看到的世界</text><text x="620" y="212" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#2a2a35" font-weight="600" text-anchor="end">是 Harness 裁剪过的</text><rect x="40" y="254" width="600" height="84" rx="10" fill="#f8f8fc" stroke="#c08a3a" stroke-width="2"/><text x="75" y="282" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#c08a3a" font-weight="700" text-anchor="start">工具调度</text><text x="75" y="304" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#6b6b80" font-weight="normal" text-anchor="start">存在吗？有权限吗？</text><text x="75" y="322" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#6b6b80" font-weight="normal" text-anchor="start">参数对吗？过了才执行</text><text x="620" y="288" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#2a2a35" font-weight="600" text-anchor="end">模型只是「提议」</text><text x="620" y="308" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#2a2a35" font-weight="600" text-anchor="end">Harness 才是「裁决」</text><rect x="40" y="350" width="600" height="84" rx="10" fill="#f8f8fc" stroke="#4a8c6f" stroke-width="2"/><text x="75" y="378" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#4a8c6f" font-weight="700" text-anchor="start">状态管理</text><text x="75" y="400" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#6b6b80" font-weight="normal" text-anchor="start">消息列表 + 工具历史</text><text x="75" y="418" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#6b6b80" font-weight="normal" text-anchor="start">+ 中间结果 + 断点恢复</text><text x="620" y="384" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#2a2a35" font-weight="600" text-anchor="end">模型是无状态的</text><text x="620" y="404" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#2a2a35" font-weight="600" text-anchor="end">状态全是 Harness 在扛</text></svg>